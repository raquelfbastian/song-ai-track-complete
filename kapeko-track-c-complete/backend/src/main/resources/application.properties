server.port=8080

# ── Request protection ──────────────────────────────────────────────────
rate-limit.general-limit=${RATE_LIMIT_MAX:100}
rate-limit.ai-limit=${LLM_RATE_LIMIT_MAX:10}
rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:900000}

# Load local development secrets/config when backend/.env or the repository .env exists.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ── LLM Configuration ──────────────────────────────────────────────────
# Swap provider by changing llm.provider: openai | anthropic | azure
llm.provider=${LLM_PROVIDER:azure}
llm.api-key=${LLM_API_KEY:your-api-key-here}
llm.model=${LLM_MODEL:gpt-4o}

# If using Anthropic Claude:
# llm.provider=anthropic
# llm.model=claude-3-5-sonnet-20241022

# If using Azure OpenAI:
llm.azure.endpoint=${AZURE_OPENAI_ENDPOINT:${LLM_AZURE_ENDPOINT:}}
llm.azure.deployment=${AZURE_OPENAI_DEPLOYMENT:${LLM_MODEL:gpt-4o}}

# ── App ────────────────────────────────────────────────────────────────
spring.application.name=kapeko
catalog.output-path=data/catalog.json

# ── CORS ───────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173,http://localhost:3000
