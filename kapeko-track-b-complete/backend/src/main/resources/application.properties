server.port=8080

# Load local development secrets/config when backend/.env exists.
spring.config.import=optional:file:.env[.properties]

# ── LLM Configuration ──────────────────────────────────────────────────
# Built-in: openai | anthropic | azure | groq
# Generic OpenAI-compatible: openai-compatible | custom | ollama
llm.provider=${LLM_PROVIDER:openai}
llm.api-key=${LLM_API_KEY:your-api-key-here}
llm.model=${LLM_MODEL:gpt-4o}
# For custom/OpenAI-compatible providers, set the URL including /v1 when required.
# llm.base-url=http://localhost:11434/v1
# llm.embedding-model=text-embedding-3-small

# If using Anthropic Claude:
# llm.provider=anthropic
# llm.model=claude-3-5-sonnet-20241022

# If using Azure OpenAI:
# llm.provider=azure
llm.azure.endpoint=${AZURE_OPENAI_ENDPOINT:}
llm.azure.deployment=${AZURE_OPENAI_DEPLOYMENT:${LLM_MODEL:gpt-4o}}
llm.azure.embedding-endpoint=${AZURE_OPENAI_EMBEDDING_ENDPOINT:}
llm.azure.embedding-deployment=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}
# Set true only for demos without an Azure embedding deployment.
llm.azure.embedding-fallback=${AZURE_OPENAI_EMBEDDING_FALLBACK:false}

# ── App ────────────────────────────────────────────────────────────────
spring.application.name=kapeko
catalog.output-path=data/catalog.json

# ── CORS ───────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173,http://localhost:3000
