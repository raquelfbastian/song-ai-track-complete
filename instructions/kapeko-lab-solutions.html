<p>1. User clicks "Run" on Lab 3 page in the browser</p>
<p>2. React calls POST /api/catalog/generate</p>
<p>3. Vite proxy forwards the request to Spring Boot :8080</p>
<p>4. KapeKoController receives the request, calls
CatalogService.generateCatalog()</p>
<p>5. CatalogService calls LlmService.complete(systemPrompt,
userPrompt)</p>
<p>6. LlmService makes an HTTP POST to the Azure OpenAI endpoint</p>
<p>7. Azure OpenAI returns JSON with the LLM's catalog response</p>
<p>8. LlmService parses the response, returns the raw JSON string</p>
<p>9. CatalogService strips markdown fences, parses to
List&lt;Product&gt;, saves catalog.json</p>
<p>10. KapeKoController returns ResponseEntity with the product list</p>
<p>11. React receives the JSON, updates state, renders the product
cards</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ 11 specific steps — not "React calls Spring Boot which calls the
LLM".</p>
<p>▸ Names every component: Vite proxy, KapeKoController,
CatalogService, LlmService.</p>
<p>▸ The fences-stripping step (9) shows awareness of a real
implementation detail.</p>
<p>▸ "Updates state" vs "updates the DOM" — React-accurate language.</p>
</blockquote>
<p class="wb-heading"><strong>2. Level 1 vs Level 2 — what changed?</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>In Level 1, I was a user of an AI tool. In Level 2, I am a builder of
AI features.</p>
<p>Level 1 (M365 Agent Builder):</p>
<p>- I configured an agent using a UI — no code</p>
<p>- The AI infrastructure was Microsoft's — I could not control the
model, the API calls,</p>
<p>the response parsing, or where the output was stored</p>
<p>- I could ground the agent with a Knowledge file, but not with
programmatic data</p>
<p>- The agent ran inside Microsoft's chat interface — not embeddable in
a custom product</p>
<p>Level 2 (LLM API in Spring Boot):</p>
<p>- I am making the API calls directly — I control the model,
temperature, and prompt</p>
<p>- I can parse, validate, store, and transform the LLM output
programmatically</p>
<p>- The AI features run inside a product I own — embeddable,
extendable, deployable</p>
<p>- I can switch providers by changing one line in
application.properties</p>
<p>The core shift: from configuring AI to integrating AI into
software.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ Structured as a parallel comparison — same dimensions for both
levels.</p>
<p>▸ "I can switch providers by changing one line" shows understanding
of the</p>
<p>LlmService abstraction — a direct code-to-architecture
connection.</p>
<p>▸ "From configuring AI to integrating AI into software" — a clean
summary</p>
<p>that could be used in a client conversation.</p>
</blockquote>
<p class="wb-heading"><strong>3. The Hybris / SFCC connection</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>Lab 3 maps directly to SAP Commerce Cloud's ImpEx import process.</p>
<p>In a real Hybris implementation, product catalog data is imported via
ImpEx scripts —</p>
<p>structured CSV/text files that match the Hybris product type system
schema.</p>
<p>Every field in the ImpEx header must match the product attribute
exactly,</p>
<p>or the import fails.</p>
<p>What Alex built in Lab 3 is the same concept:</p>
<p>- The JSON schema in the prompt = the ImpEx header</p>
<p>- The LLM generating structured JSON = a tool generating an ImpEx
file</p>
<p>- parseProducts() mapping JSON to List&lt;Product&gt; = Hybris
parsing ImpEx to FlexibleSearch</p>
<p>The difference: ImpEx requires a human to write the data.</p>
<p>Lab 3's approach uses an LLM to generate it from a prompt.</p>
<p>This is the exact use case for AI-assisted catalog population in SAP
Commerce.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ Specific — names ImpEx, not just "structured data import".</p>
<p>▸ Three-part mapping (prompt schema = ImpEx header, etc.) shows
genuine understanding</p>
<p>of both the code and the commerce platform.</p>
<p>▸ "AI-assisted catalog population in SAP Commerce" — this is a real
SONG engagement</p>
<p>accelerator and Alex has just described it correctly.</p>
</blockquote>
<p class="wb-heading"><strong>4. What Level 3 will add</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>Looking at the Lab 2 journey map — three AI opportunities were
identified:</p>
<p>Stage 3 (Browse): "AI recommends based on mood description"</p>
<p>→ Lab 6 Shopping Copilot: the chat widget that maps moods to
products</p>
<p>Stage 4 (Search): "Semantic search — not just keyword matching"</p>
<p>→ Lab 7 Commerce RAG: embed catalog descriptions as vectors, retrieve
by similarity</p>
<p>"light floral coffee" finds Benguet Sunrise without the word "floral"
in the name</p>
<p>Stage 8 (Retention): "AI-powered product recommendations"</p>
<p>→ Lab 8 Recommendation Engine: "You might also like" using vector
similarity</p>
<p>Bought Benguet? Get Sagada recommended because the vectors are
close.</p>
<p>All three are embedded in the same storefront built in Lab 5.</p>
<p>Level 3 does not rebuild the app — it adds features to it.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ References the Level 1 Lab 2 journey map — connects all levels.</p>
<p>▸ Names the specific lab for each opportunity — shows program
awareness.</p>
<p>▸ The RAG example ("light floral coffee" finds Benguet Sunrise) is
technically</p>
<p>correct — it is vector similarity, not keyword matching.</p>
<p>▸ "Level 3 does not rebuild — it adds features" — shows understanding
of the</p>
<p>progressive architecture. This is the right mental model for the
whole program.</p>
<p><strong>The pattern across all excellent Level 2 answers: grounded +
specific + commercial.</strong></p>
<p>Grounded: prompt decisions are traced to actual Kape Ko data from the
Level 1 KB — not invented. Specific: every evaluation names exact
fields, exact values, exact fixes — not "it was mostly good."
Commercial: the gap analysis uses commerce platform language (ImpEx,
OCC, Spartacus, SFCC product detail page) — not generic software
language. Level 1 taught specificity. Level 2 adds grounding and
commercial context. Level 3 onwards requires all three — every time.</p>
</blockquote>
<p><em>SONG Commerce AI Labs · Season 1 · Level 2: Commerce Builder ·
Sample Solution · v1.0</em></p>
<p><em>For learner reference only · Do not read before completing Labs
3, 4 &amp; 5</em></p>` },

{ id:'s34-02', module:'Levels 3–4 · Labs 6–10 Sample Solution', title:'01 · Lab 6 — Shopping Copilot', body:`<p class="wb-heading"><strong>What buildCatalogContext() does and why it is in the system
prompt</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>buildCatalogContext() loops through all products from catalog.json
and</p>
<p>builds a formatted text block listing each product's name, roast,
pricing,</p>
<p>best_for, and flavor_notes.</p>
<p>It goes in the system prompt — not the user message — because it is
context</p>
<p>the agent always needs, not something the customer provides.</p>
<p>The LLM uses this catalog to constrain its recommendations to real
Kape Ko products.</p>
<p>Without it, the agent would invent products (hallucinate) or
recommend</p>
<p>generic coffee types not available in the store.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ "System prompt = what the agent always knows" is the correct
framing.</p>
<p>▸ "User message = what the customer says" is the correct
complement.</p>
<p>▸ Identifying hallucination as the risk of not grounding is the Level
1 lesson applied.</p>
</blockquote>
<p class="wb-heading"><strong>Copilot evaluation — 3 mood-based queries</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>Query 1: "I'm exhausted from a long week"</p>
<p>→ Copilot: Mt. Apo Dark — "Bold and earthy, exactly what you need
after a long week.</p>
<p>Subscribe for ₱400/mo and it arrives automatically." ✅ Correct</p>
<p>Query 2: "I want something to help me focus this afternoon"</p>
<p>→ Copilot: Sagada Mist — "Smooth chocolate notes for sustained
focus.</p>
<p>The medium roast hits without the jitters." ✅ Correct</p>
<p>Query 3: "I'm new to specialty coffee, what should I try first?"</p>
<p>→ Copilot: Kape Ko Blend — "Approachable, balanced, great starting
point.</p>
<p>Subscribe at ₱380/mo — cancel anytime." ✅ Correct</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ All three recommendations come from the catalog — no invented
products.</p>
<p>▸ Each has a specific reason tied to the product's best_for
field.</p>
<p>▸ The subscription upsell appears in all three — the system prompt
rule is working.</p>
</blockquote>
<p class="wb-heading"><strong>Does the Copilot maintain context?</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>Yes. Follow-up test:</p>
<p>Message 1: "I'm stressed today" → Copilot recommends Mt. Apo Dark</p>
<p>Message 2: "What does it taste like?" → Copilot describes Mt. Apo
Dark specifically,</p>
<p>not a generic coffee.</p>
<p>Without conversation history, Message 2 would return a generic
answer.</p>
<p>The history is maintained because history.add() appends to the
session list</p>
<p>and completeWithHistory() sends the full list to the LLM on each
call.</p>
<p><strong>⚠️ A weak answer looks like this</strong></p>
<p>Weak answer: "Yes, the history works because I can see it in the
code."</p>
<p>Why weak: does not test it — just reads the code.</p>
<p>Strong answers test the claim, record the actual result, and explain
the mechanism.</p>
</blockquote>` },
{ id:'s34-03', module:'Levels 3–4 · Labs 6–10 Sample Solution', title:'02 · Lab 7 — Commerce RAG', body:`<p class="wb-heading"><strong>Why @PostConstruct and what it means</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>@PostConstruct marks a method to run automatically after Spring has
finished</p>
<p>creating and injecting dependencies into the bean.</p>
<p>indexCatalog() is annotated with it because we need the LLM service
and catalog</p>
<p>service to be available before we can embed products. If we called it
in the</p>
<p>constructor, those dependencies might not be injected yet.</p>
<p>Practical result: the catalog is indexed at server startup — every
search request</p>
<p>after that uses pre-built vectors instead of embedding on demand.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ "Dependencies must be injected before @PostConstruct runs" is
correct.</p>
<p>▸ "Pre-built vectors = fast search" — distinguishes indexing time
from query time.</p>
<p>▸ This is also why the workbook says to run POST
/api/catalog/generate before restarting</p>
<p>— if catalog.json does not exist, @PostConstruct finds nothing to
index.</p>
</blockquote>
<p class="wb-heading"><strong>Cosine similarity — what the values mean</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>1.0 means the two vectors are identical — same direction in vector
space.</p>
<p>Semantically: the query and product describe the same concept.</p>
<p>0.0 means the vectors are orthogonal — completely unrelated.</p>
<p>Semantically: the query and product share no conceptual overlap.</p>
<p>Cosine similarity beats string matching because it measures meaning,
not letters.</p>
<p>"light floral coffee" and "jasmine citrus honey" share zero words</p>
<p>but both represent light, aromatic beverages — their vectors are
close.</p>
<p>String matching finds nothing. Cosine similarity finds Benguet
Sunrise.</p>
</blockquote>
<p class="wb-heading"><strong>Semantic search query results</strong></p>
<table>
<colgroup>
<col style="width: 29%"/>
<col style="width: 23%"/>
<col style="width: 19%"/>
<col style="width: 27%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Query</strong></th>
<th><strong>Top result</strong></th>
<th><strong>Makes semantic sense?</strong></th>
<th><strong>Why</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>"light floral coffee"</td>
<td>Benguet Sunrise</td>
<td>✅ Yes</td>
<td>Jasmine + citrus = floral, light roast</td>
</tr>
<tr class="even">
<td>"coffee for a productive afternoon"</td>
<td>Sagada Mist</td>
<td>✅ Yes</td>
<td>Medium roast, best for focus</td>
</tr>
<tr class="odd">
<td>"bold strong earthy"</td>
<td>Mt. Apo Dark</td>
<td>✅ Yes</td>
<td>Dark roast, earthy flavor notes</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>✅ Why this works</strong></p>
<p>▸ All three correct — the embedding model captured semantic
meaning.</p>
<p>▸ Recording the actual result (not just "it worked") is the expected
standard.</p>
<p>▸ Including "why" in the evaluation shows understanding — not just
observation.</p>
</blockquote>` },
{ id:'s34-04', module:'Levels 3–4 · Labs 6–10 Sample Solution', title:'03 · Lab 8 — Recommendation Engine', body:`<p class="wb-heading"><strong>How recommend() builds the query</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>recommend() builds the query by concatenating:</p>
<p>- product.getName() — the full product name</p>
<p>- product.getBestFor() — the mood/occasion the product is for</p>
<p>- product.getFlavorNotes() joined — the flavor profile</p>
<p>Example for Benguet Sunrise (SKU-001):</p>
<p>"Benguet Sunrise — Light Roast Calm mornings, reflective mood jasmine
citrus honey"</p>
<p>This text is passed to retrieve() which embeds it and finds the
closest products.</p>
<p>Products close to this vector = products with similar
mood/flavor/occasion profiles.</p>
<p>The product itself is excluded by filtering on productId before
returning.</p>
</blockquote>
<p class="wb-heading"><strong>Recommendation quality evaluation</strong></p>
<table>
<colgroup>
<col style="width: 23%"/>
<col style="width: 27%"/>
<col style="width: 14%"/>
<col style="width: 33%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Product</strong></th>
<th><strong>Top recommendation</strong></th>
<th><strong>Makes sense?</strong></th>
<th><strong>Why</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Benguet Sunrise (light, jasmine)</td>
<td>Sagada Mist</td>
<td>✅ Yes</td>
<td>Closest: also single-origin, similar calm/focus mood</td>
</tr>
<tr class="even">
<td>Mt. Apo Dark (bold, stressed)</td>
<td>Kape Ko Blend</td>
<td>✅ Yes</td>
<td>Second-boldest, good bridge product</td>
</tr>
<tr class="odd">
<td>Kape Ko Blend (balanced)</td>
<td>Sagada Mist or Benguet</td>
<td>✅ Yes</td>
<td>Medium roast matches balanced profile</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>The recommendations are semantically meaningful — not random.</p>
<p>Products with similar mood profiles (calm/reflective) appear
together.</p>
<p>Dark/bold products cluster separately from light/floral ones.</p>
<p>One observation: the Gift Box (SKU-006) recommendation is weaker
—</p>
<p>it clusters with Sagada Mist because both mention "sharing" and
"occasion"</p>
<p>in their best_for fields, even though the use case is very
different.</p>
<p>This is a limitation of simple vector similarity without
domain-specific fine-tuning.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ Identifies a specific weakness (Gift Box clustering) — not just "it
works".</p>
<p>▸ Names the cause (best_for field overlap) — shows understanding of
the algorithm.</p>
<p>▸ "Without domain-specific fine-tuning" — commercial framing of a
real limitation.</p>
</blockquote>` },
{ id:'s34-05', module:'Levels 3–4 · Labs 6–10 Sample Solution', title:'04 · Lab 9 — Order Assistant Agent', body:`<p class="wb-heading"><strong>How the system prompt signals a tool call</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>The system prompt instructs the LLM to signal a tool call by
returning JSON</p>
<p>in this exact format:</p>
<p>{ "tool": "toolName", "args": { "param": "value" } }</p>
<p>The isToolCall() method checks for two things: the response starts
with {</p>
<p>and contains the string "tool". Both must be true.</p>
<p>If the LLM decides no tool is needed, it returns plain text — not
JSON.</p>
<p>The agent responds conversationally in that case.</p>
</blockquote>
<p class="wb-heading"><strong>Tool trigger test results</strong></p>
<table>
<colgroup>
<col style="width: 42%"/>
<col style="width: 34%"/>
<col style="width: 23%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Message</strong></th>
<th><strong>Tool triggered</strong></th>
<th><strong>toolCalled: true</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>"Where is my order ORD-123?"</td>
<td>getOrderStatus</td>
<td>✅</td>
</tr>
<tr class="even">
<td>"Pause my subscription for 2 months"</td>
<td>pauseSubscription</td>
<td>✅</td>
</tr>
<tr class="odd">
<td>"Switch me to Sagada Mist"</td>
<td>changeSubscriptionProduct</td>
<td>✅</td>
</tr>
<tr class="even">
<td>"I want to return order ORD-456"</td>
<td>initiateReturn</td>
<td>✅</td>
</tr>
</tbody>
</table>
<p class="wb-heading"><strong>Copilot vs Order Agent — key difference</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>The Shopping Copilot (Lab 6) is conversational — it responds with
text.</p>
<p>It influences the customer (recommendation) but does not change any
state.</p>
<p>The Order Agent (Lab 9) is agentic — it acts. It calls functions that
change state:</p>
<p>pausing a subscription, initiating a return, switching a product.</p>
<p>The difference is not the LLM — both use the same model.</p>
<p>The difference is what the code does with the LLM output.</p>
<p>Copilot: text → display to user.</p>
<p>Order Agent: JSON → parse tool name → execute function → change
system state.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ "Same LLM, different output handling" — correct and commercially
precise.</p>
<p>▸ "Change system state" — the key distinguishing phrase for agentic
AI.</p>
<p>▸ This framing is exactly how you would explain the difference to a
client.</p>
</blockquote>
<p class="wb-heading"><strong>What pauseSubscription() would do in a real
system</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>In a real Kape Ko system, pauseSubscription() would call the
subscription</p>
<p>management platform API — Recurly, Chargebee, or a custom OMS.</p>
<p>Specifically it would:</p>
<p>1. Authenticate with the subscription service API</p>
<p>2. Look up the customer's active subscription by customerId</p>
<p>3. Call the pause endpoint with the duration</p>
<p>4. Receive a confirmation with the resume date</p>
<p>5. Optionally: send a confirmation email via the CRM</p>
<p>6. Log the action in the customer service audit trail</p>
<p>The mock implementation in the lab returns a fixed response to
demonstrate</p>
<p>the pattern without requiring external API access.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ Names a real subscription platform (Recurly, Chargebee) — not just
"some API".</p>
<p>▸ 5-step implementation — shows understanding of real integration
complexity.</p>
<p>▸ "Audit trail" — commerce operations requirement that many learners
miss.</p>
</blockquote>` },
{ id:'s34-06', module:'Levels 3–4 · Labs 6–10 Sample Solution', title:'05 · Lab 10 — Multi-Agent Catalog Pipeline', body:`<p class="wb-heading"><strong>The three agent responsibilities</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>CatalogAgent: validates and structures product data — ensures
required fields</p>
<p>are present, types are correct, prices are in range, roast levels are
valid.</p>
<p>ContentAgent: generates brand-voice marketing copy —
product_description and</p>
<p>marketing_hook. Same rules as Level 2 ContentService but with a
tighter,</p>
<p>more focused system prompt for consistency across agents.</p>
<p>SeoAgent: generates SEO-optimised title and meta description —
focused on</p>
<p>search intent, character limits, and including the brand name and
price.</p>
</blockquote>
<p class="wb-heading"><strong>ContentAgent vs Level 2 BRAND_VOICE — what
changed</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>Level 2 BRAND_VOICE was a multi-purpose system prompt for ALL content
fields —</p>
<p>SEO, description, hook, bullets, pairing in one call.</p>
<p>Level 3 ContentAgent is focused: description and hook only.</p>
<p>The SeoAgent handles SEO separately.</p>
<p>Benefits of separation:</p>
<p>1. Each agent can be improved independently without affecting the
others</p>
<p>2. ContentAgent can be fine-tuned for brand voice without risking SEO
output</p>
<p>3. SeoAgent can optimise for keyword density without sounding
corporate</p>
<p>4. Failures are isolated — a ContentAgent error does not break the
SEO output</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ "Improved independently" and "failures are isolated" — two key
software engineering</p>
<p>principles applied correctly to AI system design.</p>
<p>▸ The SEO/brand voice tension is real — optimising for keywords often
sounds corporate.</p>
<p>Separating them into agents is a genuine architectural decision.</p>
</blockquote>
<p class="wb-heading"><strong>Serial vs parallel time calculation</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>Serial: 6 products × 5 seconds each = 30 seconds total.</p>
<p>Parallel (thread pool of 3): 6 products ÷ 3 threads = 2 batches × 5
seconds = ~10 seconds.</p>
<p>The ExecutorService uses 3 threads because the LLM API typically
allows</p>
<p>3-5 concurrent requests before rate limiting.</p>
<p>More threads would not help — the bottleneck is the API rate limit,
not CPU.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ "Bottleneck is the API rate limit, not CPU" — the correct reason
for the pool size.</p>
<p>Many learners say "3 threads = 3x faster" without explaining why not
more.</p>
<p>▸ This is production engineering thinking: the constraint is
external, not local.</p>
</blockquote>
<p class="wb-heading"><strong>Single-agent vs multi-agent comparison</strong></p>
<table>
<colgroup>
<col style="width: 25%"/>
<col style="width: 29%"/>
<col style="width: 29%"/>
<col style="width: 14%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Dimension</strong></th>
<th><strong>Level 2 single agent</strong></th>
<th><strong>Level 3 multi-agent</strong></th>
<th><strong>Better</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Description quality</td>
<td>Consistent — 1 system prompt</td>
<td>Slightly better — focused agent</td>
<td>Multi-agent</td>
</tr>
<tr class="even">
<td>SEO title accuracy</td>
<td>Mixed — SEO in a long prompt</td>
<td>Better — dedicated SEO agent</td>
<td>Multi-agent</td>
</tr>
<tr class="odd">
<td>Brand voice</td>
<td>Good — explicit rules</td>
<td>Similar — same rules, focused</td>
<td>Similar</td>
</tr>
<tr class="even">
<td>Time to generate</td>
<td>~8s for all fields</td>
<td>~12s (3 agents per product)</td>
<td>Single agent</td>
</tr>
<tr class="odd">
<td>Maintainability</td>
<td>Hard — one big prompt</td>
<td>Easy — agents are independent</td>
<td>Multi-agent</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>Multi-agent is worth it for large-scale catalog operations — 100+
products —</p>
<p>where consistency and maintainability matter more than speed.</p>
<p>For small catalogs (6 products in the Kape Ko demo), the added
complexity</p>
<p>is harder to justify. The real value shows at scale.</p>
<p>Choose multi-agent when:</p>
<p>▸ Different aspects of the output need different expertise (SEO vs
brand voice)</p>
<p>▸ Agents need to be updated or swapped independently</p>
<p>▸ Failures in one aspect should not block others</p>
<p>Choose single-agent when:</p>
<p>▸ The output is simple and unified</p>
<p>▸ Speed matters more than maintainability</p>
<p>▸ The catalog is small and prompts are already clear</p>
</blockquote>` },
{ id:'s34-07', module:'Levels 3–4 · Labs 6–10 Sample Solution', title:'06 · Levels 3 & 4 Reflection — Model Answers', body:`<p class="wb-heading"><strong>1. The AI progression — one sentence each</strong></p>
<table>
<colgroup>
<col style="width: 21%"/>
<col style="width: 78%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Level</strong></th>
<th><strong>One-sentence summary</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Level 1</td>
<td>Used an AI tool (M365 Agent Builder) to run a commerce discovery
engagement without writing code.</td>
</tr>
<tr class="even">
<td>Level 2</td>
<td>Called the LLM API directly in code to generate and enrich a product
catalog with structured JSON and brand-voice content.</td>
</tr>
<tr class="odd">
<td>Level 3</td>
<td>Added real AI features to the storefront: a conversational copilot,
semantic RAG search, and vector-similarity recommendations.</td>
</tr>
<tr class="even">
<td>Level 4</td>
<td>Built autonomous agents that act: an order agent that calls tools,
and an orchestrator that delegates to specialist agents in
parallel.</td>
</tr>
</tbody>
</table>
<p class="wb-heading"><strong>2. The commerce connection</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>Lab 7 (Commerce RAG) maps directly to SFCC Einstein Search.</p>
<p>SFCC Einstein Search uses vector embeddings to match customer queries
to products</p>
<p>semantically — not just by keyword. "Comfortable walking shoes"
returns trail runners</p>
<p>even if the product listing does not contain those exact words.</p>
<p>The RagService in Lab 7 implements the same pipeline:</p>
<p>embed product descriptions → store vectors → embed query → cosine
similarity → retrieve.</p>
<p>The key difference: SFCC Einstein uses a managed vector service
(Einstein platform).</p>
<p>Lab 7 uses an in-process JVM store. Same concept, different
infrastructure.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ "Same concept, different infrastructure" — the correct way to
bridge the lab to the platform.</p>
<p>▸ Naming SFCC Einstein Search specifically (not just "search") shows
platform knowledge.</p>
<p>▸ The trail runners example is a concrete illustration — not
abstract.</p>
</blockquote>
<p class="wb-heading"><strong>3. RAG vs putting catalog in system prompt — when to use
which</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>Catalog in system prompt (Lab 6 approach):</p>
<p>▸ Use when: catalog is small (under ~20 products), changes
infrequently,</p>
<p>and every query could plausibly need any product.</p>
<p>▸ Kape Ko with 6 products: system prompt is fine.</p>
<p>▸ Limit: token cost grows linearly with catalog size.</p>
<p>1,000 products × 200 tokens each = 200,000 tokens per request. Not
viable.</p>
<p>RAG (Lab 7 approach):</p>
<p>▸ Use when: catalog is large (100+ products), only 3-5 are relevant
per query,</p>
<p>or products are frequently updated.</p>
<p>▸ RAG retrieves only the relevant 3 — the LLM never sees the other
997.</p>
<p>▸ Token cost stays flat regardless of catalog size.</p>
<p>Decision rule: if ALL products could be the right answer for ANY
query → system prompt.</p>
<p>If most queries are relevant to only a subset → RAG.</p>
</blockquote>
<p class="wb-heading"><strong>4. Battle of the Builders — demo order</strong></p>
<blockquote>
<p><strong>✏️ Alex's answer</strong></p>
<p>1. Live storefront (Lab 5) — "Here is the Kape Ko store, running on
Codespaces."</p>
<p>Open the product listing. Show roast filter. Click Benguet
Sunrise.</p>
<p>Why first: establishes the baseline — without the app, nothing else
makes sense.</p>
<p>2. Lab 3 catalog generation — "All products were generated by an
LLM."</p>
<p>Click Lab 3 in the nav. Run generate. Products appear.</p>
<p>Why second: shows the AI foundation before the AI features.</p>
<p>3. Shopping Copilot (Lab 6) — "I need coffee for a stressed
Monday."</p>
<p>Click the chat button. Type the query. Show recommendation.</p>
<p>Why third: most visually engaging — clients immediately understand
the value.</p>
<p>4. Semantic search (Lab 7) — "Light floral coffee" → Benguet
Sunrise.</p>
<p>Type in the search bar. Show AI answer + source SKU.</p>
<p>Why fourth: contrasts with the copilot — different AI pattern, same
storefront.</p>
<p>5. Order agent (Lab 9) — "Pause my subscription for 2 months."</p>
<p>Call POST /api/agent/order via the browser or a simple UI.</p>
<p>Show toolCalled: true and the structured result.</p>
<p>Why fifth: finishes on the agentic demo — the most advanced
capability.</p>
<p>Clients leave thinking about autonomous agents, not just
chatbots.</p>
<p><strong>✅ Why this works</strong></p>
<p>▸ The demo order follows a narrative: app → AI foundation → copilot →
search → agent.</p>
<p>▸ "Clients leave thinking about autonomous agents" — the story
matters as much as the demo.</p>
<p>▸ Each "why this order" answer connects to client psychology — this
is consulting thinking.</p>
<p><strong>The pattern across all excellent Level 3 &amp; 4
answers:</strong></p>
<p>Specific over general. Tested, not assumed. Commercially framed.
Every evaluation names the actual result, the mechanism that produced
it, and the implication for a real commerce engagement. "It works" is
never a complete answer. "It works because X, which matters in a
production system because Y" — that is the standard.</p>
</blockquote>
<p><em>SONG Commerce AI Labs · Season 1 · Levels 3 &amp; 4 · Sample
Solution · v1.0</em></p>` },
{ id:'repo-01', module:'Complete Working Solution', title:'Run the Complete Solution (All Tracks)', body:`<p>Every lab has a complete, working version of the Kape Ko solution for each track. It is one repo — download it, open it in GitHub Codespaces, and you can run the finished storefront end to end.</p>
<p class="wb-heading"><strong>The repo</strong></p>
<blockquote>
<p><strong>🔗 Complete solution repo</strong></p>
<p><a href="${COMPLETE_REPO_URL}" target="_blank" rel="noopener">${COMPLETE_REPO_URL}</a></p>
</blockquote>
<p>Inside the repo there is one folder per track:</p>
<table>
<thead>
<tr class="header"><th><strong>Folder</strong></th><th><strong>Track</strong></th><th><strong>Stack</strong></th></tr>
</thead>
<tbody>
<tr class="odd"><td>kapeko-track-a-complete/</td><td>Track A</td><td>Node.js + React TypeScript</td></tr>
<tr class="even"><td>kapeko-track-b-complete/</td><td>Track B</td><td>Spring Boot + Angular</td></tr>
<tr class="odd"><td>kapeko-track-c-complete/</td><td>Track C</td><td>Spring Boot + React TypeScript</td></tr>
</tbody>
</table>
<p class="wb-heading"><strong>1 Open the repo in your browser.</strong></p>
<blockquote>
<p>Use the link above.</p>
</blockquote>
<p class="wb-heading"><strong>2 Open it in GitHub Codespaces.</strong></p>

let completed = {};
try { completed = JSON.parse(localStorage.getItem('kapeko-solutions-progress') || '{}'); } catch (e) { completed = {}; }
let activeId = lessons[0].id;

function save() {
  try { localStorage.setItem('kapeko-solutions-progress', JSON.stringify(completed)); } catch (e) {}
}

function moduleList() {
  const seen = [];
  lessons.forEach(l => { if (!seen.includes(l.module)) seen.push(l.module); });
  return seen;
}

function renderSidebar() {
  const wrap = document.getElementById('sidebar-modules');
  wrap.innerHTML = '';
  moduleList().forEach(mod => {
    const group = document.createElement('div');
    group.className = 'module-group';
    const title = document.createElement('p');
    title.className = 'module-title';
    title.textContent = mod;
    group.appendChild(title);
    lessons.filter(l => l.module === mod).forEach((l) => {
      const globalIdx = lessons.indexOf(l);
      const btn = document.createElement('button');
      btn.className = 'lesson-item' + (l.id === activeId ? ' active' : '') + (completed[l.id] ? ' done' : '');
      btn.innerHTML = `
        <span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6L5 9L10 3" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--cream-fg')}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="lesson-text">${globalIdx + 1}. ${l.title}</span>
      `;
      btn.addEventListener('click', () => { activeId = l.id; render(); window.scrollTo(0,0); });
      group.appendChild(btn);
    });
    wrap.appendChild(group);
  });

  const doneCount = Object.values(completed).filter(Boolean).length;
  const pct = Math.round((doneCount / lessons.length) * 100);
  document.getElementById('progress-text').textContent = `${doneCount} / ${lessons.length} complete`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function renderContent() {
  const idx = lessons.findIndex(l => l.id === activeId);
  const l = lessons[idx];
  const el = document.getElementById('content');
  const isDone = !!completed[l.id];
  el.innerHTML = `
    <p class="crumb">${l.module} · Section ${idx + 1} of ${lessons.length}</p>
    <h1 class="lesson-title">${l.title}</h1>
    <div class="lesson-body">${l.body}</div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prev-btn" ${idx === 0 ? 'disabled' : ''}>&larr; Previous</button>
      <button class="nav-btn primary" id="complete-btn">${isDone ? 'Mark as not done' : 'Mark as complete'}</button>
      <button class="nav-btn" id="next-btn" ${idx === lessons.length - 1 ? 'disabled' : ''}>Next &rarr;</button>
    </div>
  `;
  document.getElementById('complete-btn').addEventListener('click', () => {
    completed[l.id] = !completed[l.id]; save(); render();
  });
  document.getElementById('prev-btn').addEventListener('click', () => {
    if (idx > 0) { activeId = lessons[idx - 1].id; render(); window.scrollTo(0,0); }
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    if (idx < lessons.length - 1) { activeId = lessons[idx + 1].id; render(); window.scrollTo(0,0); }
  });
}

function render() { renderSidebar(); renderContent(); }
render();
</script>
