{ id:'l34-16', module:'Lab 8 · Recommendation Engine', title:'Lab 8 Overview — Recommendation Engine', body:`<p>⏱ 90 min Backend + React component · Reuses Lab 7 vectors</p>
<p>Prerequisite: Level 2 storefront running on Codespaces</p>
<p class="wb-heading"><strong>WHY THIS LAB STILL MATTERS</strong></p>
<p>AI can rank similar products automatically, but similarity alone does
not guarantee a useful recommendation. Commerce teams must determine
whether the selected attributes represent customer intent, whether
recommendations support the business objective, and whether the results
are explainable and appropriate. This lab develops the judgment to
evaluate recommendation relevance rather than accepting a ranked list at
face value.</p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> Increase product discovery and
cross-sell potential by presenting relevant alternatives on the product
detail page.</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> Decide which product signals
should drive similarity, how to exclude invalid results, how many
recommendations to return, and how to evaluate whether the ranking is
commercially meaningful.</td>
</tr>
</tbody>
</table>
<p>The goal is not simply to make the feature run. The goal is to
understand and defend the decisions that make the AI capability
relevant, grounded, controlled, and safe to operate.</p>
<p>In Lab 8 you add "You might also like" to the product detail page —
powered by the same vector store from Lab 7. No new embeddings
needed.</p>
<blockquote>
<p><strong>🤖 AI concept</strong></p>
<p>AI skill: AI-powered recommendations via vector similarity.</p>
<p>RecommendationService reuses the RagService vector store.</p>
<p>For any product, it builds a query from the product name + flavor
notes,</p>
<p>retrieves similar products by cosine similarity, and excludes the
product itself.</p>
<p>This is Stage 8 (Retention) from the Lab 2 journey map — now
built.</p>
<p>Same pattern as SFCC Einstein Product Recommendations.</p>
</blockquote>` },
{ id:'l34-17', module:'Lab 8 · Recommendation Engine', title:'Lab 8 · Step 1 — Add RecommendationService.java', body:`<p><strong>Step 1 Add RecommendationService.java</strong> ⏱ 10 min</p>

http://localhost:8080/api/products/SKU-001/recommendations?topN=3</p>

{ id:'l34-21', module:'Lab 9 · Order Assistant Agent', title:'Lab 9 Overview — Order Assistant Agent', body:`<p>⏱ 120 min Backend · AI skill: tool-calling agents</p>
<p>Prerequisite: Level 2 storefront running on Codespaces</p>
<p class="wb-heading"><strong>WHY THIS LAB STILL MATTERS</strong></p>
<p>Low-code platforms and AI agents can connect natural-language
requests to backend actions, but an agent that can act introduces
greater operational risk than an agent that only responds. This lab
develops the judgment to define tool boundaries, validate arguments,
control execution, and consider what must be protected before an AI
agent is allowed to change an order or subscription.</p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> Improve post-purchase service by
allowing customers to complete common order and subscription requests
through a conversational interface.</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> Decide which operations the
agent may perform, how intent maps to tools and arguments, what
validations and approval controls are required, and how failures or
incorrect actions should be handled.</td>
</tr>
</tbody>
</table>
<p>The goal is not simply to make the feature run. The goal is to
understand and defend the decisions that make the AI capability
relevant, grounded, controlled, and safe to operate.</p>
<p>In Lab 9 you build an autonomous order management agent. A customer
says "pause my subscription for 2 months" — the agent decides to call
pauseSubscription(), executes it, and responds. No human selects the
tool.</p>
<blockquote>
<p><strong>🤖 AI concept</strong></p>
<p>AI skill: tool-calling (function-calling) agents.</p>
<p>Until now, every LLM call returned text. In Lab 9, the LLM returns
structured JSON</p>
<p>that describes which tool to call and with what arguments.</p>
<p>Your code reads that JSON and executes the function.</p>
<p>The shift: from "AI that answers" to "AI that acts."</p>
<p>This is the fundamental pattern of all agentic systems.</p>
</blockquote>` },

{ id:'l34-26', module:'Lab 10 · Multi-Agent Pipeline', title:'Lab 10 Overview — Multi-Agent Catalog Pipeline', body:`<p>⏱ 120 min Backend · AI skill: multi-agent orchestration</p>
<p>Prerequisite: Level 2 storefront running on Codespaces</p>
<p class="wb-heading"><strong>WHY THIS LAB STILL MATTERS</strong></p>
<p>AI tools can create a single large prompt that attempts to do
everything, but complex commerce workflows often require clearer
separation of responsibilities, independent quality controls, and
reliable orchestration. This lab develops the judgment to decide when
specialist agents create real value and when they only add cost,
latency, and operational complexity.</p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> Scale catalog enrichment by
coordinating specialist capabilities for product structure, brand
content, and SEO while keeping outputs consistent and reviewable.</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> Decide how work should be
divided across agents, how outputs should be merged and validated, how
parallel execution should be controlled, and when multi-agent
orchestration is justified over a simpler single-agent design.</td>
</tr>
</tbody>
</table>
<p>The goal is not simply to make the feature run. The goal is to
understand and defend the decisions that make the AI capability
relevant, grounded, controlled, and safe to operate.</p>
<p>In Lab 10 you build an orchestrator that delegates to three
specialist agents — CatalogAgent, ContentAgent, and SeoAgent — which run
in parallel. Each agent has a specialised system prompt.</p>
<blockquote>
<p><strong>🤖 AI concept</strong></p>
<p>AI skill: multi-agent orchestration.</p>
<p>One large LLM prompt that does everything is hard to maintain and
often inconsistent.</p>
<p>Specialist agents — each with a focused system prompt — produce
better results</p>
<p>and are easier to improve independently.</p>
<p>Orchestrator pattern: one agent coordinates, multiple agents
execute.</p>
<p>This is the direction of enterprise AI — not monolithic, but
modular.</p>
</blockquote>` },

let completed = {};
try { completed = JSON.parse(localStorage.getItem('kapeko-l1-workbook-progress') || '{}'); } catch (e) { completed = {}; }
let activeId = lessons[0].id;

function save() {
  try { localStorage.setItem('kapeko-l1-workbook-progress', JSON.stringify(completed)); } catch (e) {}
}

function moduleList() {
  const seen = [];
  lessons.forEach(l => { if (!seen.includes(l.module)) seen.push(l.module); });
  return seen;
}

function renderSidebar() {
  const wrap = document.getElementById('sidebar-modules');
  wrap.innerHTML = '';
  moduleList().forEach(mod => {
    const group = document.createElement('div');
    group.className = 'module-group';
    const title = document.createElement('p');
    title.className = 'module-title';
    title.textContent = mod;
    group.appendChild(title);
    lessons.filter(l => l.module === mod).forEach((l) => {
      const globalIdx = lessons.indexOf(l);
      const btn = document.createElement('button');
      btn.className = 'lesson-item' + (l.id === activeId ? ' active' : '') + (completed[l.id] ? ' done' : '');
      btn.innerHTML = `
        <span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6L5 9L10 3" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--cream-fg')}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="lesson-text">${globalIdx + 1}. ${l.title}</span>
      `;
      btn.addEventListener('click', () => { activeId = l.id; render(); window.scrollTo(0,0); });
      group.appendChild(btn);
    });
    wrap.appendChild(group);
  });

  const doneCount = Object.values(completed).filter(Boolean).length;
  const pct = Math.round((doneCount / lessons.length) * 100);
  document.getElementById('progress-text').textContent = `${doneCount} / ${lessons.length} complete`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function renderContent() {
  const idx = lessons.findIndex(l => l.id === activeId);
  const l = lessons[idx];
  const el = document.getElementById('content');
  const isDone = !!completed[l.id];
  el.innerHTML = `
    <p class="crumb">${l.module} · Section ${idx + 1} of ${lessons.length}</p>
    <h1 class="lesson-title">${l.title}</h1>
    <div class="lesson-body">${l.body}</div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prev-btn" ${idx === 0 ? 'disabled' : ''}>&larr; Previous</button>
      <button class="nav-btn primary" id="complete-btn">${isDone ? 'Mark as not done' : 'Mark as complete'}</button>
      <button class="nav-btn" id="next-btn" ${idx === lessons.length - 1 ? 'disabled' : ''}>Next &rarr;</button>
    </div>
  `;
  document.getElementById('complete-btn').addEventListener('click', () => {
    completed[l.id] = !completed[l.id]; save(); render();
  });
  document.getElementById('prev-btn').addEventListener('click', () => {
    if (idx > 0) { activeId = lessons[idx - 1].id; render(); window.scrollTo(0,0); }
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    if (idx < lessons.length - 1) { activeId = lessons[idx + 1].id; render(); window.scrollTo(0,0); }
  });
}

function render() { renderSidebar(); renderContent(); }
render();
</script>
