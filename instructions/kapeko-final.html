<p class="wb-heading"><strong>Design Question 4 — What output format will your agent produce?</strong></p>
<p>List every section you want in the final brief. Be specific about what each section must contain.</p>
<p class="wb-heading"><strong>Design Question 5 — How will your agent signal confidence?</strong></p>
<p>Write the exact instruction you will give the agent for tagging fields as CONFIRMED, ASSUMED, OPEN, or RISK.</p>
<p><strong>STEP 2 Build your agent in M365 Copilot Agent Builder</strong> 15 min</p>` },
{ id:'wb-12', module:'Lab 1 · Discovery Agent', title:'Configure Your Discovery Agent', body:`<p>Now take your answers from Step 1 and build them into a real agent. Follow these steps exactly.</p>
<p class="wb-heading"><strong>1 Open microsoft365.com and sign in with your work account.</strong></p>
<p class="wb-heading"><strong>2 Click Copilot in the top nav, then find Agents in the left panel.</strong></p>
<p class="wb-heading"><strong>3 Click "+ New agent."</strong></p>
<p class="wb-heading"><strong>4 Click "Skip to configure."</strong></p>
<blockquote>
<p>This takes you directly to the Configure tab — you write the Instructions yourself.</p>
<p><strong>🖥️ What you should see on screen</strong></p>
<p>The Configure tab is now open. You should see: a Name field at the top, a Description field below it, a large Instructions text area in the middle, a Knowledge section below that, and a Try it tab or panel on the right side of the screen. If you do not see the Try it panel, look for a small arrow or toggle on the right edge of the screen.</p>
</blockquote>
<p class="wb-heading"><strong>5 In the Name field, type:</strong></p>
<blockquote>
<p>Kape Ko Discovery Agent</p>
</blockquote>
<p class="wb-heading"><strong>6 In the Description field, type:</strong></p>
<blockquote>
<p>A commerce discovery agent that interviews a founder and produces a structured Commerce Business Brief for Kape Ko.</p>
</blockquote>
<p class="wb-heading"><strong>7 Click inside the Instructions field.</strong></p>
<blockquote>
<p>This is where your system prompt goes. Use your answers from Step 1 to write it now.</p>
<p><strong>What to write in the Instructions field</strong></p>
<p>Structure your Instructions using the three-part formula from Lab 0:</p>
<p>## Role</p>
<p>Write your answer to Design Question 1.</p>
<p>## How to conduct the interview</p>
<p>Write your interview rules from Design Question 2.</p>
<p>Include: ask one question at a time, how to handle vague answers (Design Question 3).</p>
<p>## Output format</p>
<p>Write your output structure from Design Question 4.</p>
<p>Include: the confidence tagging instruction from Design Question 5.</p>
<p>Do not copy a prompt from another source.</p>
<p>The quality of your Instructions reflects the quality of your thinking.</p>
</blockquote>
<p class="wb-heading"><strong>8 Save your Instructions.</strong></p>
<blockquote>
<p>Ctrl+S (Windows) / Cmd+S (Mac) — or the Save button at the top.</p>
<p><strong>🖥️ What you should see on screen</strong></p>
<p>The Instructions field should now contain your full prompt — all four sections (Role, How to conduct the interview, Confidence tagging rules, Output format). The Save button at the top should no longer show unsaved changes. The Try it tab on the right should be empty and ready for a fresh conversation.</p>
<p><strong>⚠️ Critical: always reset Try it after saving</strong></p>
<p>After saving Instructions, switch to the Try it tab.</p>
<p>Click the refresh/reset icon at the top of the chat.</p>
<p>Start a fresh conversation — otherwise the agent uses the old Instructions.</p>
</blockquote>
<p><strong>STEP 3 Run the interview WITHOUT a Knowledge source — first</strong> 20 min</p>` },
{ id:'wb-13', module:'Lab 1 · Discovery Agent', title:'Interview Kape Ko — No Knowledge Attached', body:`<p>Your agent currently has only the Instructions you wrote. It has no Knowledge file connected. This is intentional — you are going to run the interview now, without any KB, and observe what your agent produces.</p>
<p>This step has one purpose: to see what the agent invents when it does not have real data to work from. You will compare this output to a second run in Step 5 — after you connect the Kape Ko Knowledge Base.</p>
<blockquote>
<p><strong>⚠️ Do NOT connect Knowledge yet</strong></p>
<p>You will upload the Knowledge file in Step 4.</p>
<p>Run this interview with Instructions only — no Knowledge tab connected.</p>
<p>If you already connected Knowledge, go to the Configure tab → Knowledge section</p>
<p>and remove it before proceeding.</p>
</blockquote>
<p>Switch to the Try it tab. You will play the role of the Kape Ko founder. Use only the information below.</p>
<blockquote>
<p><strong>Kape Ko Founder Brief — what you know when you walk into this meeting</strong></p>
<p>You are one of the two founders of Kape Ko.</p>
<p>What you know for certain:</p>
<p>▸ You sell single-origin Filipino coffee — beans from Benguet, Sagada, and Mt. Apo</p>
<p>▸ You want monthly subscriptions — but you are open to one-time purchases too</p>
<p>▸ Your farm story card is your biggest differentiator</p>
<p>▸ You plan to sell online — website for sure, possibly Instagram Shop</p>
<p>What you are NOT sure about:</p>
<p>▸ Whether to do B2B (corporate gifting) from day one or focus on B2C first</p>
<p>▸ Your exact price point — somewhere between ₱400 and ₱900 per 250g bag</p>
<p>▸ How you will handle subscribers who want to pause or cancel</p>
<p>▸ Whether you will ship nationwide on day one or Metro Manila only</p>
<p>What you do not know at all:</p>
<p>▸ Which platform to use</p>
<p>▸ How many subscribers you can realistically get in year one</p>
<p>▸ What your top competitors are doing</p>
<p>Stay in character. If your agent asks something you do not know — say so.</p>
</blockquote>
<p>After the full interview, paste or copy your agent's output into the table below. Focus especially on any fields where the agent seems very specific — prices, policies, delivery times. Note these — they are likely invented.</p>
<p class="wb-heading"><strong>Run 1 Output — No Knowledge (paste key fields here):</strong></p>
<table>
<colgroup>
<col style="width: 25%"/>
<col style="width: 38%"/>
<col style="width: 35%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Field the agent produced</strong></th>
<th><strong>What it said</strong></th>
<th><strong>Invented or confirmed?</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Price per bag</td>
<td></td>
<td></td>
</tr>
<tr class="even">
<td>Subscription cadence</td>
<td></td>
<td></td>
</tr>
<tr class="odd">
<td>Shipping coverage</td>
<td></td>
<td></td>
</tr>
<tr class="even">
<td>Cancellation policy</td>
<td></td>
<td></td>
</tr>
<tr class="odd">
<td>Corporate gifting</td>
<td></td>
<td></td>
</tr>
<tr class="even">
<td>Other — ___________</td>
<td></td>
<td></td>
</tr>
<tr class="odd">
<td>Other — ___________</td>
<td></td>
<td></td>
</tr>
</tbody>
</table>
<p class="wb-heading"><strong>After reviewing Run 1, answer these:</strong></p>
<p class="wb-heading"><strong>What specific numbers or policies did the agent produce that you never told it?</strong></p>
<p class="wb-heading"><strong>How confident are you that these are accurate?</strong></p>
<p><strong>STEP 4 Upload the Kape Ko Knowledge Base to your agent</strong> 15 min</p>` },
{ id:'wb-14', module:'Lab 1 · Discovery Agent', title:'Connect Real Data to Your Agent', body:`<p>You are now going to give your agent a source of truth — the Kape Ko Knowledge Base. This is a document containing the real product catalog, real pricing, real subscription policies, real farm data, and real FAQs for Kape Ko.</p>
<p>When your agent has access to this file, it can answer questions from the actual data — instead of generating plausible-sounding but invented answers.</p>
<blockquote>
<p><strong>This is Mini-RAG</strong></p>
<p>What you are doing right now is a simplified version of Retrieval-Augmented Generation (RAG).</p>
<p>RAG = giving an AI agent a knowledge source it can search and reference</p>
<p>when answering questions, instead of relying on its training data.</p>
<p>In Lab 7, you will build a full Commerce RAG system with a vector database.</p>
<p>Right now, you are experiencing the same core concept — grounded vs ungrounded output —</p>
<p>in the simplest possible way: upload a file, run the same question, compare the answer.</p>
<p>This is why it matters: in real commerce AI, an ungrounded product agent is dangerous.</p>
<p>It will confidently quote wrong prices, invent policies, and mislead customers.</p>
</blockquote>
<p class="wb-heading"><strong>Download the Knowledge Base file</strong></p>
<p>The Kape Ko Knowledge Base file has been provided to you alongside this workbook:</p>
<blockquote>
<p><strong>File to download and upload</strong></p>
<p>Filename: KapeKo_KnowledgeBase_v1.docx</p>
<p>This file contains:</p>
<p>▸ Brand story and founding history</p>
<p>▸ Full product catalog — 6 SKUs with exact pricing, farm origins, flavour notes</p>
<p>▸ Subscription model details — cadence, skip/pause/cancel/gift policies</p>
<p>▸ Dunning policy with exact day-by-day timeline</p>
<p>▸ Shipping coverage and fees by region</p>
<p>▸ Farm origin profiles — Benguet, Sagada, Mt. Apo</p>
<p>▸ 20+ FAQs</p>
<p>▸ Brand voice guidelines</p>
</blockquote>
<p class="wb-heading"><strong>Upload the file to your agent's Knowledge tab</strong></p>
<p class="wb-heading"><strong>1 In M365 Copilot Agent Builder, open your Kape Ko Discovery Agent.</strong></p>
<blockquote>
<p>Go to microsoft365.com → Copilot → Agents → find "Kape Ko Discovery Agent" → click Edit.</p>
</blockquote>
<p class="wb-heading"><strong>2 Click the Configure tab.</strong></p>
<p class="wb-heading"><strong>3 Scroll down to the Knowledge section.</strong></p>
<blockquote>
<p>It is below the Instructions field. You should see a "+ Add knowledge" button.</p>
</blockquote>
<p class="wb-heading"><strong>4 Click "+ Add knowledge."</strong></p>
<blockquote>
<p>A panel or menu appears with options for how to add knowledge.</p>
</blockquote>
<p class="wb-heading"><strong>5 Select "Upload files" or "Files."</strong></p>
<blockquote>
<p>The exact label may vary — look for an option that lets you upload a document from your computer.</p>
</blockquote>
<p class="wb-heading"><strong>6 Upload KapeKo_KnowledgeBase_v1.docx from your computer.</strong></p>
<blockquote>
<p>Wait for the upload to complete. You should see the file name appear in the Knowledge section.</p>
</blockquote>
<p class="wb-heading"><strong>7 Save your agent.</strong></p>
<blockquote>
<p>Ctrl+S or the Save button at the top.</p>
<p><strong>⚠️ What you should see after uploading</strong></p>
<p>In the Knowledge section of the Configure tab:</p>
<p>▸ The filename "KapeKo_KnowledgeBase_v1.docx" should appear</p>
<p>▸ There may be a processing indicator while M365 indexes the file</p>
<p>▸ Wait until processing is complete before testing — usually 1–2 minutes</p>
<p>If the file does not appear or upload fails:</p>
<p>▸ Check the file size — files over 5MB may not upload. This file is well within limit.</p>
<p>▸ Try a different browser (Edge works best with M365 Agent Builder)</p>
<p>▸ Ask your programme coordinator if Knowledge upload is enabled in your tenant</p>
</blockquote>
<p class="wb-heading"><strong>✅ Check: Knowledge is connected</strong></p>
<p class="wb-heading"><strong>Write the filename as it appears in the Knowledge section after upload:</strong></p>
<p><strong>STEP 5 Run the same interview WITH Knowledge — compare</strong> 20 min</p>` },
{ id:'wb-15', module:'Lab 1 · Discovery Agent', title:'Interview Kape Ko Again — With the Knowledge Base', body:`<p>Now run the exact same discovery interview you ran in Step 3. Use the same Founder Brief. Play the same role. Your agent now has access to the Kape Ko Knowledge Base — so its answers to questions about pricing, policies, products, and shipping should be grounded in real data.</p>
<blockquote>
<p><strong>⚠️ Before starting Run 2</strong></p>
<p>1. Make sure the Knowledge file is uploaded and processing is complete (Step 4).</p>
<p>2. Switch to the Try it tab.</p>
<p>3. Click the reset / refresh icon to start a fresh conversation.</p>
<p>4. Use exactly the same Founder Brief from Step 3 — same answers to the same questions.</p>
</blockquote>
<p>After the full interview, record the same fields from Run 2 and compare them to Run 1:</p>

<td></td>
<td></td>

</tr>
<tr class="even">
<td>Subscription cadence</td>
<td></td>
<td></td>
<td>Yes / No</td>
</tr>
<tr class="odd">
<td>Shipping coverage</td>
<td></td>
<td></td>
<td>Yes / No</td>
</tr>
<tr class="even">
<td>Cancellation policy</td>
<td></td>
<td></td>
<td>Yes / No</td>
</tr>
<tr class="odd">
<td>Corporate gifting</td>
<td></td>
<td></td>
<td>Yes / No</td>
</tr>
<tr class="even">
<td>Other — ___________</td>
<td></td>
<td></td>
<td>Yes / No</td>
</tr>
<tr class="odd">
<td>Other — ___________</td>
<td></td>
<td></td>
<td>Yes / No</td>
</tr>
</tbody>
</table>
<p class="wb-heading"><strong>After comparing Run 1 and Run 2, answer these:</strong></p>
<p class="wb-heading"><strong>Which fields changed the most between Run 1 and Run 2?</strong></p>
<p class="wb-heading"><strong>In Run 1, what did the agent invent that Run 2 corrected with real data?</strong></p>
<p>Give at least two specific examples. Name the exact wrong value from Run 1 and the correct value from Run 2.</p>
<p class="wb-heading"><strong>Why does this difference matter in a real commerce engagement?</strong></p>
<p>Think about what would happen if a customer-facing agent gave Run 1 answers instead of Run 2 answers.</p>
<blockquote>
<p><strong>🧠 The lesson: what you just experienced is RAG</strong></p>
<p>Run 1 = your agent using only its training data to fill gaps → hallucination</p>
<p>Run 2 = your agent retrieving and referencing real data → grounded answers</p>
<p>The gap between Run 1 and Run 2 is exactly why grounding matters.</p>
<p>In a real Kape Ko store:</p>
<p>▸ Run 1 answers would mislead customers about pricing and policies</p>
<p>▸ Run 2 answers would be accurate, auditable, and trustworthy</p>
<p>In Lab 7 (Commerce RAG), you will build this grounding system properly —</p>
<p>with a vector database that lets your agent search across thousands of products.</p>
<p>Today you experienced the concept. Lab 7 is where you build the architecture.</p>
</blockquote>
<p><strong>STEP 6 Validate your final output — tag every field</strong> 20 min</p>` },
{ id:'wb-16', module:'Lab 1 · Discovery Agent', title:'Tag Every Field in Your Brief', body:`<p>Read through your agent's output carefully. For every piece of information it produced, decide: did the founder actually say this, did the agent infer it, or is it still unknown?</p>
<p>Go through your brief and write one confidence tag next to every field:</p>

<p><strong>▸</strong> ✅ CONFIRMED — founder stated this explicitly</p>

{ id:'wb-17', module:'Lab 1 · Discovery Agent', title:'Break It On Purpose', body:`<p>Pick one of the three scenarios below — choose the one that interests you most, or the one that feels most relevant to your agent's likely weakness. Go to the Try it tab, reset the conversation, and run the scenario exactly as written.</p>
<blockquote>
<p><strong>Scenario A — The Vague Founder</strong></p>
<p>Opening message: "We want to sell coffee online. We want it to be like Netflix but for coffee."</p>
<p>For every follow-up question from your agent: give a vague, one-word, or contradictory answer.</p>
<p>Watch for: what does your agent invent when the input is nearly empty?</p>
<p><strong>Scenario B — The Overconfident Founder</strong></p>
<p>Opening message: "We sell premium Filipino single-origin coffee. Monthly subscription, ₱800/month.</p>
<p>Target: 28–40 year old urban professionals. Ship nationwide. GCash. Launch in 60 days."</p>
<p>Answer every follow-up question confidently — even make things up.</p>
<p>Watch for: what did your agent fail to ask? What gaps remain despite the confident answers?</p>
<p><strong>Scenario C — The Conflicted Founder</strong></p>
<p>Opening message: "We want subscriptions but also one-time purchases. Premium but accessible.</p>
<p>B2C but also corporate gifting. Launch in 60 days but no platform yet."</p>
<p>Maintain contradictions throughout. Do not resolve them even if the agent asks.</p>
<p>Watch for: does your agent surface the contradictions, or does it bury them in a clean-looking brief?</p>
</blockquote>
<p class="wb-heading"><strong>After the stress test, answer these questions:</strong></p>
<p class="wb-heading"><strong>What did your agent invent that you did not tell it?</strong></p>
<p class="wb-heading"><strong>What important question did your agent fail to ask?</strong></p>
<p class="wb-heading"><strong>Which line in your Instructions caused the failure? What would you change?</strong></p>
<p><strong>STEP 8 Iterate and improve</strong> 15 min</p>` },
{ id:'wb-18', module:'Lab 1 · Discovery Agent', title:'Fix One Thing in Your Instructions', body:`<p>Based on what you observed in Step 5, return to the Configure tab and make one targeted improvement. Do not rewrite the whole prompt — fix the one thing that broke.</p>

{ id:'wb-21', module:'Lab 2 · Journey Architect', title:'Lab 2 Overview', body:`<p class="wb-heading"><strong>Customer Journey Architect</strong></p>
<p>From touchpoints to systems — a journey map that drives decisions</p>
<p>⏱ 120 min M365 Copilot Agent Builder Individual</p>
<p class="wb-heading"><strong>COMMERCE CONCEPT</strong></p>
<p class="wb-heading"><strong>What commerce capability does this lab build?</strong></p>
<p>Customer Journey Mapping as Architecture — the ability to map a customer experience across all commerce touchpoints and connect each stage to the system, capability, and data that must support it.</p>
<p>A journey map is not a feelings diagram. In commerce consulting, it is an architecture tool. Every stage is powered by one or more systems. Understanding the journey means understanding what the technology stack must deliver — and where the gaps are.</p>
<p class="wb-heading"><strong>LEARNING OBJECTIVES</strong></p>
<p class="wb-heading"><strong>By the end of Lab 2, you will be able to:</strong></p>
<blockquote>
<p><strong>1.</strong> Build a second agent in M365 Copilot Agent Builder — using your Brief from Lab 1 as input.</p>
<p><strong>2.</strong> Produce a journey map where every stage includes the commerce system responsible for it.</p>
<p><strong>3.</strong> Identify capability gaps: which stages Kape Ko cannot support at launch.</p>
<p><strong>4.</strong> Map the journey to a real commerce platform and defend the recommendation.</p>
<p><strong>5.</strong> Surface the implied business rules hidden inside the journey.</p>
<p><strong>6.</strong> Give structured peer critique of another participant's journey map.</p>
</blockquote>` },

{ id:'wb-23', module:'Lab 2 · Journey Architect', title:'Build the Journey Designer Agent', body:`<p>Create a second agent in M365 Copilot Agent Builder. This agent takes your Commerce Business Brief from Lab 1 as input and produces a full customer journey map.</p>

<p class="wb-heading"><strong>4 Paste your Instructions into the Configure tab. Save.</strong></p>
<p class="wb-heading"><strong>5 Switch to Try it. Reset the conversation.</strong></p>
<p class="wb-heading"><strong>6 Paste your entire Lab 1 Commerce Business Brief as your first message.</strong></p>
<blockquote>
<p>Your agent should read the brief and personalise the journey for Kape Ko.</p>
<p><strong>🖥️ What you should see on screen</strong></p>
<p>In the Try it tab, your Commerce Business Brief from Lab 1 should appear as the first message. The agent should then respond with a question or begin generating the journey map — depending on how you wrote your Instructions. If the agent responds with a generic Copilot reply and ignores the brief, check that your Instructions clearly tell the agent to read the input as a Commerce Business Brief.</p>
</blockquote>
<p><strong>STEP 2 Generate and record all 9 stages</strong> 20 min</p>` },

{ id:'wb-25', module:'Lab 2 · Journey Architect', title:'Gap Analysis', body:`<p>For each stage, assess whether Kape Ko has the required capability at launch. Be honest — a startup launching its first subscription store does not have a CDP, a personalisation engine, or real-time inventory visibility.</p>
<table>
<colgroup>
<col style="width: 15%"/>
<col style="width: 23%"/>

<col style="width: 31%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Stage</strong></th>
<th><strong>Commerce system</strong></th>
<th><strong>Has it? ✅ ❓ ❌</strong></th>
<th><strong>Priority P1/P2/P3</strong></th>
<th><strong>AI opportunity type</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Awareness</td>
<td></td>

</tr>

<td></td>
</tr>

<td></td>
</tr>
<tr class="even">
<td>Support</td>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
<tr class="odd">
<td>Retention</td>
<td></td>

<td></td>
<td></td>
</tr>
</tbody>
</table>
<p>After completing the table, answer:</p>
<p class="wb-heading"><strong>Which P1 gaps, if unaddressed, would prevent the store from launching?</strong></p>
<p class="wb-heading"><strong>Which AI opportunities are NOT realistic at Kape Ko's launch scale — and why?</strong></p>
<blockquote>
<p><strong>⚠️ AI Risk: Check these before moving on</strong></p>
<p>▸ Invented touchpoints — does the map include loyalty points or personalisation at launch?</p>
<p>Kape Ko has no purchase history data on day one.</p>
<p>▸ Generic emotions — "happy" and "satisfied" are not useful.</p>
<p>"Confused about the difference between Benguet and Sagada" is a Kape Ko emotion.</p>
<p>▸ Unrealistic AI at launch — "real-time personalisation at browse" requires a CDP.</p>
<p>Mark it as a future capability, not a day-one feature.</p>
<p>▸ Missing compliance touchpoints — FDA registration for food products, provincial</p>
<p>shipping restrictions, and payment regulations in the Philippines. AI rarely surfaces these.</p>
</blockquote>
<p><strong>STEP 4 Platform mapping — solo activity</strong> 15 min</p>` },
{ id:'wb-26', module:'Lab 2 · Journey Architect', title:'Map the Journey to a Commerce Platform', body:`<p>Pick one platform from the table below. Choose the one you are most curious about, or the one you think is most likely to be recommended for Kape Ko. You will assess how well it handles the Kape Ko journey, then write a recommendation at the end.</p>
<table style="width:100%;">
<colgroup>
<col style="width: 25%"/>
<col style="width: 39%"/>
<col style="width: 35%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Platform</strong></th>
<th><strong>Key Strength for Kape Ko</strong></th>
<th><strong>Key Limitation for Kape Ko</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Shopify Plus</td>
<td>Fastest to launch. Native subscription app ecosystem (Recharge, Bold).</td>
<td>Subscription billing via apps — adds cost and complexity vs native.</td>
</tr>
<tr class="even">
<td>SAP Commerce Cloud</td>
<td>Enterprise-grade B2B/B2C, strong OMS, configurable pricing engine.</td>
<td>High implementation cost and long time-to-market. Overkill at launch.</td>
</tr>
<tr class="odd">
<td>Adobe Commerce</td>
<td>Highly customisable PIM and content management.</td>
<td>Developer-heavy. Subscription support via extensions only.</td>
</tr>
<tr class="even">
<td>Salesforce Commerce Cloud</td>
<td>Strong personalisation engine and AI built in.</td>
<td>High cost. Subscription commerce needs a third-party integration.</td>
</tr>
</tbody>
</table>
<p class="wb-heading"><strong>The platform you chose: _______________</strong></p>
<p>Why did you choose this one?</p>
<p class="wb-heading"><strong>Which journey stages does this platform support natively?</strong></p>
<p class="wb-heading"><strong>Which stages require customisation or a third-party integration?</strong></p>
<p class="wb-heading"><strong>Platform recommendation for Kape Ko at launch (one paragraph — defend it):</strong></p>
<p><strong>STEP 5 Surface business rules</strong> 10 min</p>` },
{ id:'wb-27', module:'Lab 2 · Journey Architect', title:'Business Rules Log', body:`<p>A journey map implies business rules that are never explicitly written down. These rules must be documented before development begins — they drive logic in checkout, OMS, the subscription engine, and the support portal.</p>
<blockquote>
<p><strong>Example business rule</strong></p>
<p>"Subscribers can pause for up to two months per year."</p>
<p>This implies logic in: the subscription management API, the billing engine,</p>
<p>the customer portal UI, and the CRM.</p>
<p>None of this can be built until the rule is written down.</p>
</blockquote>
<p>Find at least five implied business rules in your journey map:</p>
<table>
<colgroup>
<col style="width: 5%"/>
<col style="width: 38%"/>

</colgroup>

<th><strong>#</strong></th>
<th><strong>Business rule</strong></th>
<th><strong>Journey stage</strong></th>
<th><strong>System it lives in</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>1</td>
<td></td>
<td></td>
<td></td>
</tr>
<tr class="even">
<td>2</td>

<td></td>
<td></td>
</tr>
<tr class="odd">
<td>3</td>
<td></td>

</tr>

<td></td>
</tr>
<tr class="odd">

<td></td>
<td></td>
<td></td>
</tr>
</tbody>
</table>
<p><strong>STEP 6 Self-critique — review your own journey map</strong> 15 min</p>` },
{ id:'wb-28', module:'Lab 2 · Journey Architect', title:'Critically Review Your Own Journey Map', body:`<p>Put on a different hat. You have spent 20+ minutes producing this journey map — now step back and review it as if you were a senior consultant seeing it for the first time. Answer all four critique questions honestly. An unclear answer is a gap worth fixing before you submit.</p>
<p class="wb-heading"><strong>Critique 1 — Emotion vs. system complexity mismatch</strong></p>
<p>Name one stage where the emotion tag does not match the actual difficulty of the system at that stage.</p>
<p class="wb-heading"><strong>Critique 2 — Unrealistic AI opportunity</strong></p>
<p>Name one AI opportunity that would not be feasible at Kape Ko's launch scale. Explain why.</p>
<p class="wb-heading"><strong>Critique 3 — Missing stage or substage</strong></p>
<p>Name one journey stage or moment that is missing from the map entirely.</p>
<p class="wb-heading"><strong>Critique 4 — Undocumented business rule</strong></p>
<p>Name one implied business rule that is not captured in the Business Rules Log.</p>` },
{ id:'wb-29', module:'Lab 2 · Journey Architect', title:'Lab 2 Deliverable', body:`<p class="wb-heading"><strong>Validated Customer Journey Map</strong></p>

<p>☐ Platform recommendation — one paragraph, Kape Ko-specific, trade-offs acknowledged (Step 4)</p>
<p>☐ Business rules log — minimum 5 rules, each traced to a stage and system (Step 5)</p>

{ id:'wb-30', module:'Lab 2 · Journey Architect', title:'Lab 2 Assessment Rubric', body:`<p class="wb-heading"><strong>How Your Lab 2 Work Will Be Assessed</strong></p>
<table>
<colgroup>
<col style="width: 25%"/>
<col style="width: 27%"/>
<col style="width: 23%"/>
<col style="width: 23%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Criteria</strong></th>
<th><strong>Excellent</strong></th>
<th><strong>Adequate</strong></th>
<th><strong>Needs Work</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Journey Depth (system-level, not emotions only)</td>
<td>All 9 stages have all 7 fields. System named for every stage. Emotions specific to Kape Ko.</td>
<td>6+ stages complete. System named for most. Some Kape Ko specificity.</td>
<td>Touchpoints and emotions only. No system mapping. Generic emotions.</td>
</tr>
<tr class="even">
<td>Gap Analysis (honest — not falsely optimistic)</td>
<td>All 9 stages assessed. At least 3 are ❌ or ❓. P1 gaps have implications documented.</td>
<td>7+ stages assessed. Some gaps identified. Priorities assigned.</td>
<td>All ✅ — unrealistic for a pre-launch startup. No prioritisation.</td>
</tr>
<tr class="odd">
<td>Platform Recommendation (journey-grounded, defensible)</td>
<td>Clear recommendation. 3+ journey-specific reasons. Trade-offs acknowledged.</td>
<td>Recommendation present with 1–2 reasons. Trade-offs not fully addressed.</td>
<td>No recommendation, or not connected to the journey.</td>
</tr>
<tr class="even">
<td>Business Rules (specific and traceable)</td>
<td>5+ rules. Each is specific, testable, traced to a stage and system.</td>
<td>3–4 rules. Mostly traceable.</td>
<td>Fewer than 3. Rules are vague or generic.</td>
</tr>
<tr class="odd">
<td>Self-Critique (quality of your own review)</td>
<td>All 4 questions answered with journey-specific observations. Named actual gaps in your own map.</td>
<td>2–3 questions answered with some specificity.</td>
<td>Surface-level. "Looks good" or similar non-answers.</td>
</tr>
</tbody>
</table>` },
{ id:'wb-31', module:'Wrap-up', title:'Level 1 Completion Checklist', body:`<p class="wb-heading"><strong>Before You Move to Level 2</strong></p>
<p>Check every item below. If any is incomplete, return to the relevant step and finish it before submitting.</p>
<p class="wb-heading"><strong>Lab 1 — Commerce Business Brief</strong></p>
<blockquote>
<p>☐ Discovery Triangle Summary written (Business / Customer / Technology)</p>
<p>☐ Run 1 completed — interview without KB — Run 1 output table filled in</p>
<p>☐ Kape Ko Knowledge Base file uploaded to agent Knowledge tab</p>
<p>☐ Run 2 completed — same interview with KB — comparison table filled in</p>
<p>☐ All 13 fields in the Commerce Brief completed and tagged (from Run 2 output)</p>
<p>☐ Subscription Commerce Requirements table filled in for all 6 capabilities</p>
<p>☐ Discovery Backlog has at least 5 open questions with priorities</p>
<p>☐ KB Comparison Summary (Component 6) completed with specific examples</p>
<p>☐ Responsible AI Annotation (Component 5) — 3 Run 1 hallucinations with Run 2 corrections</p>
</blockquote>
<p class="wb-heading"><strong>Lab 2 — Validated Customer Journey Map</strong></p>
<blockquote>
<p>☐ All 9 journey stages recorded with all 7 fields per stage</p>
<p>☐ Capability Gap Analysis table completed — no stages skipped</p>
<p>☐ Platform recommendation written and defended</p>
<p>☐ Business Rules Log has at least 5 rules with stage and system traced</p>
<p>☐ Self-critique completed — all 4 critique questions answered honestly</p>
<p>☐ Responsible AI Annotation completed for the journey map</p>
</blockquote>` },
{ id:'wb-32', module:'Wrap-up', title:'How Level 1 Feeds Level 2', body:`<table>

</colgroup>

<td>Your product AI opportunity defines the knowledge base scope.</td>
</tr>
<tr class="even">
<td>Journey Map — Stage 9 Retention AI</td>
<td>Lab 8: Recommendation Engine</td>

</tr>
<tr class="odd">
<td>Discovery Backlog</td>

<p><em>SONG Commerce AI Labs · Season 1 · Level 1: Commerce Explorer · Labs 1 &amp; 2 · v4.0</em></p>
<p><em>M365 Copilot Agent Builder · Kape Ko Scenario · Learner Workbook</em></p>` },
{ id:'l2-01', module:'Level 2 · Orientation', title:'Level 2 — Why These Labs Still Matter', body:`<p>Season 1 · Level 2: Commerce Builder</p>
<p class="wb-heading"><strong>Learner Workbook</strong></p>
<p>Labs 3, 4 &amp; 5 · Self-paced · All Tracks · GitHub Codespaces</p>
<p>Track A: <strong>Node.js + React TypeScript</strong> Track B:
<strong>Spring Boot + Angular</strong> Track C: <strong>Spring Boot +
React TypeScript</strong></p>
<p>Learner name: ________________________ Track: ______ Cohort:
______</p>
<p class="wb-heading"><strong>WHY THESE LABS STILL MATTER</strong></p>
<p class="wb-heading"><strong>Learn to understand, design, validate, and operate AI-enabled
commerce systems, even when AI writes much of the code.</strong></p>
<p>Modern commerce teams may use Copilot, Lovable, Retool, Power
Platform, and other low-code or no-code tools to accelerate delivery.
These tools can generate code, interfaces, workflows, and content, but
they do not remove the need for commerce and engineering judgment.</p>
<p class="wb-heading"><strong>Learners must still understand:</strong></p>
<blockquote>
<p>• What system they should ask AI to build</p>
<p>• How to determine whether the output is correct</p>
<p>• Where the solution can fail</p>
</blockquote>
<p class="wb-heading"><strong>These labs are not intended to make learners compete with AI
at writing code. They build the judgment needed to direct AI, challenge
its output, connect business requirements to technology decisions, and
operate solutions responsibly.</strong></p>
<p class="wb-heading"><strong>Every lab therefore defines two explicit
outcomes:</strong></p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> What part of the ecommerce
workflow becomes more effective, reliable, or valuable?</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> What decision must the learner
understand and defend, even when AI generates much of the
implementation?</td>
</tr>
</tbody>
</table>
<p>The activity explains what to build. The two outcomes explain why the
work remains important in an AI-assisted, low-code, and no-code delivery
model.</p>` },

{ id:'l2-03', module:'Level 2 · Orientation', title:'How to Use This Workbook (Level 2)', body:`<p>This is your self-paced guide for Level 2: Commerce Builder. You will

{ id:'l2-06', module:'Level 2 · Setup', title:'Step S2 · Add Your API Key', body:`<p><strong>Step S2 Add your API key</strong> ⏱ 5 min</p>
<p>In the terminal at the bottom, run these commands one by one:</p>
<p class="wb-heading"><strong>Track A (Node.js) — run in backend/ folder</strong></p>
<blockquote>
<p>cd backend</p>
<p>cp .env.example .env</p>
<p># Now edit the .env file — see next step</p>
</blockquote>

folder</strong></p>
<blockquote>
<p>cd backend</p>
<p># No .env copy needed — will export variables directly</p>
</blockquote>
<p>Open the .env file (Track A) or type these exports in terminal (Track
B &amp; C):</p>
<p class="wb-heading"><strong>Track A — edit backend/.env</strong></p>
<blockquote>
<p>LLM_PROVIDER=azure</p>
<p>LLM_API_KEY=your-actual-key-here</p>
<p>LLM_MODEL=gpt-4o</p>
<p>AZURE_OPENAI_ENDPOINT=https://your-resource.openai.azure.com/openai/deployments/your-deployment</p>
</blockquote>
<p class="wb-heading"><strong>Track B &amp; C — export in terminal</strong></p>
<blockquote>

<p>export LLM_API_KEY=your-actual-key-here</p>
<p>export LLM_MODEL=gpt-4o</p>
<p>export
AZURE_OPENAI_ENDPOINT=https://your-resource.openai.azure.com/openai/deployments/your-deployment</p>
</blockquote>` },
{ id:'l2-07', module:'Level 2 · Setup', title:'Step S3 · Start Both Servers', body:`<p><strong>Step S3 Start both servers</strong> ⏱ 5 min</p>
<p>You need two terminal windows — one for the backend, one for the
frontend.</p>
<p>Terminal 1 — Backend:</p>
<p class="wb-heading"><strong>Track A (Node.js)</strong></p>
<blockquote>
<p>cd backend</p>
<p>npm install</p>
<p>npm run dev</p>
</blockquote>
<p class="wb-heading"><strong>Track B &amp; C (Spring Boot)</strong></p>
<blockquote>
<p>cd backend</p>
<p>mvn spring-boot:run</p>
<p><strong>🖥️ What you should see</strong></p>
<p>Track A: "☕ Kape Ko Commerce API — Track A (Node.js)" appears in the
terminal.</p>
<p>Track B/C: "Started KapeKoApplication in X.XXX seconds" appears in
the terminal.</p>
<p>Both should end with: "Server running on http://localhost:8080"</p>
<p><strong>🛑 If you are stuck</strong></p>
<p>Track A "Cannot find module" → run npm install first, then npm run
dev.</p>
<p>Track B/C "mvn not found" → run: sdk use java 17.0.13-ms, then try
again.</p>
<p>Track B/C "LLM_API_KEY not set" → re-run the export commands in the
same terminal.</p>
<p>"Port 8080 already in use" → run: pkill -f "spring-boot" or pkill -f
"node index"</p>
</blockquote>
<p>Open a new terminal (+ button in terminal panel). Terminal 2 —
Frontend:</p>
<blockquote>
<p>cd frontend</p>
<p>npm install</p>
<p>npm run dev -- --host</p>
<p><strong>🖥️ What you should see</strong></p>
<p>VITE v5.x.x ready in XXX ms</p>
<p>➜ Local: http://localhost:5173/</p>
<p>➜ Network: http://10.x.x.x:5173/</p>
<p>Track B (Angular): "Application bundle generation complete." and port
5173 opens.</p>
<p>Go to the Ports tab at the bottom → hover over port 5173 → click the
globe icon.</p>
<p>The Kape Ko storefront should open in a new browser tab.</p>
<p>At this point it will show "Spring Boot not running" — that is
expected.</p>
<p>The catalog is empty because you have not generated it yet. That is
Lab 3.</p>
</blockquote>` },
{ id:'l2-08', module:'Lab 3 · Catalog Builder', title:'Lab 3 Overview — Product Catalog Builder', body:`<p>⏱ 90 min Backend service AI skill: structured output generation</p>
<p>All tracks — file names differ, logic is identical</p>
<p class="wb-heading"><strong>WHY THIS LAB STILL MATTERS</strong></p>
<p>AI can generate a product catalog in seconds, but speed does not
guarantee that the catalog is complete, correctly structured,
commercially usable, or grounded in approved product data. This lab
develops the ability to define the required product model, constrain the
expected output, validate the result, and improve the prompt when the
generated catalog is incomplete or inaccurate.</p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> Create a usable product catalog
faster while protecting catalog quality, product accuracy, and
downstream readiness for search, pricing, content, and storefront
experiences.</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> Decide the product schema,
required fields, output constraints, validation rules, and grounding
inputs needed before AI-generated catalog data can be accepted by a
commerce system.</td>
</tr>
</tbody>
</table>
<p>The goal is not simply to complete the code. The goal is to
understand and defend the decisions that make the generated solution
usable, accurate, and safe to operate.</p>
<p>In Lab 3, you write a backend service that calls the LLM API and asks
it to generate the Kape Ko product catalog as structured JSON. The LLM
does the work — your job is to prompt it correctly and parse the
response.</p>
<blockquote>
<p><strong>🤖 AI concept</strong></p>
<p>AI skill: structured output generation.</p>
<p>Instead of asking the LLM to "tell me about Kape Ko products", you
give it an exact JSON schema</p>
<p>and instruct it to fill in values. This is how SAP Commerce catalog
imports work — structured</p>
<p>data fed into the product model. The LLM becomes a data generator,
not a chatbot.</p>
</blockquote>` },
{ id:'l2-09', module:'Lab 3 · Catalog Builder', title:'Lab 3 · Step 1 — Open the Catalog Service File', body:`<p><strong>Step 1 Open the catalog service file</strong> ⏱ 5 min</p>
<p>Find and open this file in the VS Code file explorer:</p>
<p class="wb-heading"><strong>Track A — Node.js</strong></p>
<blockquote>
<p>backend/src/services/catalogService.js</p>
</blockquote>
<p class="wb-heading"><strong>Track B &amp; C — Spring Boot</strong></p>
<blockquote>
<p>backend/src/main/java/com/song/kapeko/service/CatalogService.java</p>
</blockquote>
<p>Read through the file. The skeleton is already there — you can see
the generateCatalog() method and the saveCatalog() helper. Your job in
the next steps is to write the prompt and wire up the LLM call.</p>` },
{ id:'l2-10', module:'Lab 3 · Catalog Builder', title:'Lab 3 · Step 2 — Write the Catalog Prompt', body:`<p><strong>Step 2 Write the catalog prompt</strong> ⏱ 20 min</p>
<p>Find the buildCatalogPrompt() method (or buildUserPrompt() in Track
B/C). Replace the placeholder with a prompt that:</p>
<blockquote>
<p><strong>▸</strong> Tells the LLM it is generating a catalog for Kape
Ko</p>
<p><strong>▸</strong> Asks for exactly 6 products across the categories
from your Level 1 brief</p>
<p><strong>▸</strong> Specifies the exact JSON schema for each
product</p>
<p><strong>▸</strong> Instructs the LLM to return only JSON — no
markdown, no explanation</p>
</blockquote>
<p class="wb-heading"><strong>The schema for each product must include these
fields:</strong></p>
<table>
<colgroup>
<col style="width: 28%"/>
<col style="width: 21%"/>
<col style="width: 50%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Field</strong></th>
<th><strong>Type</strong></th>
<th><strong>Example value</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>id</td>
<td>String</td>
<td>SKU-001</td>
</tr>
<tr class="even">
<td>name</td>
<td>String</td>
<td>Benguet Sunrise — Light Roast</td>
</tr>
<tr class="odd">
<td>category</td>
<td>String</td>
<td>Single Origin Bags</td>
</tr>
<tr class="even">
<td>roast</td>
<td>String (Light/Medium/Dark)</td>
<td>Light</td>
</tr>
<tr class="odd">
<td>origin</td>
<td>String</td>
<td>La Trinidad, Benguet, Cordillera</td>
</tr>
<tr class="even">
<td>farmer</td>
<td>String</td>
<td>Jun Carino</td>
</tr>
<tr class="odd">
<td>altitude</td>
<td>String</td>
<td>1,450–1,600 MASL</td>
</tr>
<tr class="even">
<td>price_php</td>
<td>Number</td>
<td>450</td>
</tr>
<tr class="odd">
<td>sub_price_php</td>
<td>Number</td>
<td>400</td>
</tr>
<tr class="even">
<td>flavor_notes</td>
<td>Array of strings</td>
<td>["jasmine","citrus","honey"]</td>
</tr>
<tr class="odd">
<td>best_for</td>
<td>String</td>
<td>Calm mornings, reflective mood</td>
</tr>
<tr class="even">
<td>in_stock</td>
<td>Boolean</td>
<td>true</td>
</tr>
<tr class="odd">
<td>subscription_available</td>
<td>Boolean</td>
<td>true</td>
</tr>
</tbody>
</table>
<p>Wrap the products in a top-level object:</p>
<blockquote>
<p>{ "products": [ ... ] }</p>
</blockquote>
<p>Write your prompt here before coding it:</p>
<blockquote>
<p><strong>💡 Tip</strong></p>
<p>👀 Psst — open your catalog service file right now.</p>
<p>The buildUserPrompt() method (Track A) or buildCatalogPrompt() method
(Track B/C)</p>
<p>already has a working prompt inside it. Read it carefully.</p>
<p>Your job in this step is NOT to copy it — it is to UNDERSTAND it:</p>
<p>▸ Why does it specify exactly 6 products?</p>
<p>▸ Why does it include a full JSON example with real field values?</p>
<p>▸ Why does it end with "Return a JSON object: { products: [...]
}"?</p>
<p>Once you understand the pattern, write your OWN version in the space
above.</p>
<p>In Lab 4, there is no pre-filled prompt — you write it from
scratch.</p>
</blockquote>` },
{ id:'l2-11', module:'Lab 3 · Catalog Builder', title:'Lab 3 · Step 3 — Wire Up the LLM Call', body:`<p><strong>Step 3 Wire up the LLM call</strong> ⏱ 15 min</p>
<p>In the generateCatalog() method, call the LLM service with your
prompt and parse the response:</p>
<p class="wb-heading"><strong>Track A — catalogService.js</strong></p>
<blockquote>
<p>// 1. Call LLM</p>
<p>let rawJson = await llm.complete(systemPrompt, userPrompt);</p>
<p>// 2. Strip markdown fences if present</p>
<p>rawJson = rawJson.replace(/\`\`\`json\\s*/g, '').replace(/\`\`\`\\s*/g,
'').trim();</p>
<p>// 3. Parse</p>
<p>const { products } = JSON.parse(rawJson);</p>
</blockquote>
<p class="wb-heading"><strong>Track B &amp; C — CatalogService.java</strong></p>
<blockquote>
<p>// 1. Call LLM</p>
<p>String rawJson = llmService.complete(systemPrompt, userPrompt);</p>
<p>// 2. Strip markdown fences</p>
<p>rawJson = rawJson.replaceAll("\`\`\`json\\\\s*", "").replaceAll("\`\`\`\\\\s*",
"").trim();</p>
<p>// 3. Parse to List&lt;Product&gt;</p>
<p>List&lt;Product&gt; products = parseProducts(rawJson);</p>
</blockquote>` },
{ id:'l2-12', module:'Lab 3 · Catalog Builder', title:'Lab 3 · Step 4 — Test the Catalog Endpoint', body:`<p><strong>Step 4 Test the catalog endpoint</strong> ⏱ 15 min</p>
<p>Make sure both servers are running. Then test the generate
endpoint:</p>
<p class="wb-heading"><strong>All tracks — open in browser or use the Lab 3
page</strong></p>
<blockquote>
<p>POST http://localhost:8080/api/catalog/generate</p>
</blockquote>
<p>Or: open the Codespaces storefront URL, click "Lab 3" in the nav,
then click the run button.</p>
<blockquote>
<p><strong>🖥️ What you should see</strong></p>
<p>The terminal shows: "🤖 CatalogService: calling LLM API..."</p>
<p>After 10–15 seconds: "✅ Generated 6 products → saved to
data/catalog.json"</p>
<p>In the browser (Lab 3 page): 6 product cards appear — each with id,
name,</p>
<p>roast badge, origin, farmer, flavor chips, and pricing.</p>
<p>In the file explorer: data/catalog.json now exists with your 6
products.</p>
<p><strong>🛑 If you are stuck</strong></p>
<p>"401 Unauthorized" or "403 Forbidden" → your API key is wrong or
expired.</p>
<p>Re-check LLM_API_KEY and AZURE_OPENAI_ENDPOINT in your .env /
exports.</p>
<p>"404 Not Found from POST https://..." → your Azure endpoint URL is
wrong.</p>
<p>The format must be:
https://RESOURCE.openai.azure.com/openai/deployments/DEPLOYMENT-NAME</p>
<p>Check Azure Portal → Azure OpenAI → your resource → Deployments for
the exact name.</p>
<p>"SyntaxError: Unexpected token" → the LLM returned malformed
JSON.</p>
<p>Add console.log(rawJson) before the parse call to see what was
returned.</p>
<p>Common fix: the LLM wrapped the JSON in markdown fences — the strip
code should handle this.</p>
<p>"Connection refused: 8080" → the backend is not running. Check
Terminal 1.</p>
</blockquote>` },
{ id:'l2-13', module:'Lab 3 · Catalog Builder', title:'Lab 3 · Step 5 — Verify catalog.json', body:`<p><strong>Step 5 Verify catalog.json</strong> ⏱ 10 min</p>
<p>Open data/catalog.json in VS Code. Read through it. Answer these
questions in your workbook:</p>
<p class="wb-heading"><strong>5a. Did the LLM follow your schema exactly?</strong></p>
<p>Are all 13 fields present in every product? Are the types correct
(numbers as numbers, arrays as arrays, booleans as true/false)?</p>
<p class="wb-heading"><strong>5b. How accurate is the product data?</strong></p>
<p>Compare the generated prices, farm names, and flavor notes against
the Kape Ko Knowledge Base from Level 1. How many fields did the LLM get
right vs invent?</p>
<p class="wb-heading"><strong>5c. Did the LLM invent any products not in the KB?</strong></p>
<p>Name any product that appears in the generated catalog but was NOT in
your Level 1 Commerce Brief or the Kape Ko KB.</p>
<blockquote>
<p><strong>🤖 AI concept</strong></p>
<p>This verification step is the Lab 3 equivalent of the Run 1 vs Run 2
comparison in Lab 1.</p>
<p>Without grounding: the LLM generates plausible-sounding but invented
product data.</p>
<p>With grounding (what Level 3 RAG will fix): the LLM retrieves from
the actual KB.</p>
<p>Your catalog.json right now is ungrounded — it is the LLM's best
guess at Kape Ko</p>
<p>based on your prompt alone. Notice which fields it got right and
which it invented.</p>
</blockquote>` },
{ id:'l2-14', module:'Lab 3 · Catalog Builder', title:'Lab 3 · Step 6 — Improve Your Prompt', body:`<p><strong>Step 6 Improve your prompt</strong> ⏱ 15 min</p>
<p>Based on what you found in Step 5 — improve your catalog prompt to be
more specific. Then re-generate:</p>
<blockquote>
<p><strong>▸</strong> If the LLM invented wrong prices → add the actual
price ranges from the KB to your prompt</p>
<p><strong>▸</strong> If it invented farm names → include the real
farmer names from the KB</p>
<p><strong>▸</strong> If it generated fewer than 6 products → make the
count explicit and firm</p>
<p><strong>▸</strong> If the JSON structure was inconsistent → add one
or two concrete examples to the prompt</p>
</blockquote>
<p>What did you change in your prompt and what improved?</p>
<blockquote>
<p><strong>✅ Checkpoint</strong></p>
<p>GET /api/catalog returns 6 products with all 13 fields correctly
typed</p>
<p>data/catalog.json exists in the repo</p>
<p>You can explain why at least 2 fields in the catalog look different
from the Level 1 KB</p>
<p>You have attempted at least one prompt improvement</p>
</blockquote>` },
{ id:'l2-15', module:'Lab 4 · Content Studio', title:'Lab 4 Overview — Product Content Studio', body:`<p>⏱ 90 min Backend service AI skill: batch enrichment + brand voice</p>
<p>Prerequisite: Lab 3 complete — catalog.json must exist</p>
<p class="wb-heading"><strong>WHY THIS LAB STILL MATTERS</strong></p>
<p>Generative AI can produce product content at scale, but ungoverned
generation can create generic copy, inconsistent brand voice,
unsupported claims, and content that is not ready for customers. This
lab develops the judgment to translate brand strategy into reusable
instructions, evaluate generated content, and determine what must be
corrected before publishing.</p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> Scale the creation of consistent,
product-specific commerce content while improving merchandising speed,
discoverability, and customer understanding.</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> Decide which product facts and
brand rules must be supplied, how generated content should be
structured, and what quality checks are required before AI-written
content can be published.</td>
</tr>
</tbody>
</table>
<p>The goal is not simply to complete the code. The goal is to
understand and defend the decisions that make the generated solution
usable, accurate, and safe to operate.</p>
<p>In Lab 4, you write a content enrichment service. It reads each
product from catalog.json, sends it to the LLM with Kape Ko brand voice
instructions, and gets back marketing content: SEO title, description,
hook, feature bullets, and pairing suggestion.</p>
<blockquote>
<p><strong>🤖 AI concept</strong></p>
<p>AI skill: batch enrichment + brand voice.</p>
<p>This is exactly what PIM tools like Akeneo do with AI content
generation.</p>
<p>You loop through structured data, call the LLM per item, and maintain
consistent</p>
<p>brand voice across all outputs. The brand voice lives in the system
prompt — not in</p>
<p>each individual call. This is how you scale tone consistency across
hundreds of products.</p>
</blockquote>` },
{ id:'l2-16', module:'Lab 4 · Content Studio', title:'Lab 4 · Step 1 — Define the Brand Voice', body:`<p><strong>Step 1 Define the brand voice</strong> ⏱ 10 min</p>
<p>Find the BRAND_VOICE constant in your content service file:</p>
<p class="wb-heading"><strong>Track A — contentService.js</strong></p>
<blockquote>
<p>const BRAND_VOICE = \`...\`;</p>
</blockquote>
<p class="wb-heading"><strong>Track B &amp; C — ContentService.java</strong></p>
<blockquote>
<p>private static final String BRAND_VOICE = """...""";</p>
</blockquote>
<p>Unlike Lab 3 — the BRAND_VOICE constant is intentionally empty in the
starter code. No pre-filled answer here. Write it yourself based on what
you learned about Kape Ko in Level 1:</p>
<blockquote>
<p><strong>▸</strong> What tone does Kape Ko use?</p>
<p><strong>▸</strong> What words or phrases should it never use?</p>
<p><strong>▸</strong> What should every piece of content celebrate?</p>
<p><strong>▸</strong> Who is the reader?</p>
</blockquote>
<p>Write your brand voice rules here before coding:</p>` },
{ id:'l2-17', module:'Lab 4 · Content Studio', title:'Lab 4 · Step 2 — Write the Content Prompt', body:`<p><strong>Step 2 Write the content prompt</strong> ⏱ 20 min</p>
<p>Find the buildContentPrompt() method — it is blank. Write a prompt
from scratch that:</p>
<blockquote>
<p><strong>▸</strong> Includes the product's name, origin, farmer,
roast, flavor notes, pricing, and best_for</p>
<p><strong>▸</strong> Asks for exactly 6 content fields in a specific
JSON structure</p>
<p><strong>▸</strong> References the brand voice rules (or reminds the
LLM they are in the system prompt)</p>
<p><strong>▸</strong> Instructs the LLM to respond with JSON only</p>
</blockquote>
<p>The 6 content fields you need:</p>
<table style="width:100%;">
<colgroup>
<col style="width: 28%"/>
<col style="width: 23%"/>
<col style="width: 47%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Field</strong></th>
<th><strong>Length guide</strong></th>
<th><strong>What it is</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>seo_title</td>
<td>60 chars max</td>
<td>Google-ready product title with brand name and key search term</td>
</tr>
<tr class="even">
<td>meta_description</td>
<td>155 chars max</td>
<td>Entices the click in search results — one punchy sentence</td>
</tr>
<tr class="odd">
<td>product_description</td>
<td>3 short paragraphs</td>
<td>Warm, specific, Kape Ko voice — tells the farmer's story</td>
</tr>
<tr class="even">
<td>marketing_hook</td>
<td>1 sentence</td>
<td>For hero banners or social ads — bold, memorable</td>
</tr>
<tr class="odd">
<td>feature_bullets</td>
<td>Array of 5 strings</td>
<td>Specific, benefit-driven — no generic claims</td>
</tr>
<tr class="even">
<td>pairing_suggestion</td>
<td>1 sentence</td>
<td>Food moment or ritual that pairs with this coffee</td>
</tr>
</tbody>
</table>` },
{ id:'l2-18', module:'Lab 4 · Content Studio', title:'Lab 4 · Step 3 — Implement the enrichProduct Method', body:`<p><strong>Step 3 Implement the enrichProduct method</strong> ⏱ 15
min</p>
<p>Wire up the enrichProduct() method to call the LLM and merge the
content back into the product:</p>
<p class="wb-heading"><strong>Track A — contentService.js</strong></p>
<blockquote>
<p>// Send product data + brand voice to LLM</p>
<p>let rawJson = await llm.complete(BRAND_VOICE, userPrompt);</p>
<p>rawJson = rawJson.replace(/\`\`\`json\\s*/g, '').replace(/\`\`\`\\s*/g,
'').trim();</p>
<p>// Merge enriched content into original product object</p>
<p>return { ...product, ...JSON.parse(rawJson) };</p>
</blockquote>
<p class="wb-heading"><strong>Track B &amp; C — ContentService.java</strong></p>
<blockquote>
<p>// Parse and apply each field to the product</p>
<p>JsonNode node = mapper.readTree(rawJson);</p>
<p>product.setSeoTitle(node.path("seo_title").asText());</p>
<p>product.setMarketingHook(node.path("marketing_hook").asText());</p>
<p>// ... repeat for each field</p>
<p>return product;</p>
</blockquote>` },
{ id:'l2-19', module:'Lab 4 · Content Studio', title:'Lab 4 · Step 4 — Test Enrichment on One Product', body:`<p><strong>Step 4 Test enrichment on one product</strong> ⏱ 15 min</p>
<p>Test the enrich endpoint for Benguet Sunrise (SKU-001):</p>
<blockquote>
<p>POST http://localhost:8080/api/products/SKU-001/enrich</p>
</blockquote>
<p>Or: open the Lab 4 page in the storefront and click the Benguet
Sunrise card.</p>
<blockquote>
<p><strong>🖥️ What you should see</strong></p>
<p>The terminal shows: "📝 ContentService: enriching → Benguet Sunrise —
Light Roast"</p>
<p>After 10–20 seconds, the response JSON contains the 6 new content
fields.</p>
<p>On the Lab 4 UI: the product card turns green ("✓ enriched") and a
preview panel</p>
<p>shows the SEO title, marketing hook, and product description.</p>
<p><strong>🛑 If you are stuck</strong></p>
<p>"catalog.json not found" → Lab 3 must be completed first. Run POST
/api/catalog/generate.</p>
<p>"Product not found: SKU-001" → the catalog.json uses a different id
format.</p>
<p>Open catalog.json and check the exact id value of your first
product.</p>
<p>"Cannot parse JSON" → add console.log(rawJson) before the parse to
see the raw LLM output.</p>
<p>The LLM may have returned a different structure — adjust your prompt
to be more explicit.</p>
</blockquote>` },
{ id:'l2-20', module:'Lab 4 · Content Studio', title:'Lab 4 · Step 5 — Evaluate the Content Quality', body:`<p><strong>Step 5 Evaluate the content quality</strong> ⏱ 15 min</p>
<p>Read the generated content for Benguet Sunrise carefully. Answer
these questions:</p>
<p class="wb-heading"><strong>5a. Does the SEO title follow the format?</strong></p>
<p>Is it under 60 characters? Does it include the brand name and a key
search term? Write the generated title here:</p>
<p class="wb-heading"><strong>5b. Does the marketing hook feel like Kape Ko?</strong></p>
<p>Is it warm and specific? Does it reference the farm or the farmer? Or
does it sound generic? Copy the hook here and evaluate it:</p>
<p class="wb-heading"><strong>5c. Brand voice check — does it use any banned words or phrases?</strong></p>
<p>Did the LLM use "artisanal", "premium", or any corporate-sounding
language despite your brand voice rules? List any violations:</p>` },
{ id:'l2-21', module:'Lab 4 · Content Studio', title:'Lab 4 · Step 6 — Enrich All Products', body:`<p><strong>Step 6 Enrich all products</strong> ⏱ 5 min</p>
<p>Once you are happy with the content quality for one product, enrich
all:</p>
<blockquote>
<p>POST http://localhost:8080/api/catalog/enrich-all</p>
</blockquote>
<p>Or: on the Lab 4 page, click each product card one by one until all
show "✓ enriched".</p>
<blockquote>
<p><strong>✅ Checkpoint</strong></p>
<p>POST /api/products/SKU-001/enrich returns all 6 content fields</p>
<p>The marketing hook is specific to the farm/farmer — not generic
coffee marketing</p>
<p>The product description is 3 paragraphs in Kape Ko voice</p>
<p>All 6 products are enriched (visible on Lab 4 page or via POST
/api/catalog/enrich-all)</p>
<p>You can identify at least one brand voice issue the LLM made and
explain how to fix it</p>
</blockquote>` },
{ id:'l2-22', module:'Lab 5 · Storefront', title:'Lab 5 Overview — Kape Ko Storefront', body:`<p>⏱ 120 min Frontend AI skill: AI-generated data in a real commerce
UI</p>
<p>Prerequisite: Labs 3 &amp; 4 complete — catalog and content must be
ready</p>
<p class="wb-heading"><strong>WHY THIS LAB STILL MATTERS</strong></p>
<p>AI and low-code tools can scaffold a storefront quickly, but a
working interface still depends on correct API contracts, reliable data
flow, resilient rendering, and deliberate commerce decisions. This lab
develops the ability to connect AI-generated assets to a real customer
experience and inspect whether the resulting storefront is commercially
and technically complete.</p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> Turn catalog and content outputs
into a usable customer-facing storefront that supports product discovery
and purchase decisions.</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> Decide how frontend components
consume backend data, handle missing or malformed AI-generated fields,
preserve API contracts, and expose only content that has passed commerce
quality checks.</td>
</tr>
</tbody>
</table>
<p>The goal is not simply to complete the code. The goal is to
understand and defend the decisions that make the generated solution
usable, accurate, and safe to operate.</p>
<p>In Lab 5, you complete the React (or Angular) storefront that
consumes the Spring Boot / Node.js API. The product listing page,
product detail page, and basic cart are all scaffolded — your job is to
connect them to the real API data and display the AI-generated content
from Lab 4.</p>
<blockquote>
<p><strong>🤖 AI concept</strong></p>
<p>AI skill: AI-generated data in a real commerce UI.</p>
<p>This is what makes Level 2 different from a typical coding
exercise.</p>
<p>The products on your storefront were generated by an LLM. The
descriptions and hooks</p>
<p>were written by an LLM. You built the pipeline — and now you can see
it in a real UI.</p>
<p>This storefront is also the foundation for Level 3. The Shopping
Copilot (Lab 6),</p>
<p>RAG search (Lab 7), and recommendations (Lab 8) all get embedded
here.</p>
</blockquote>` },
{ id:'l2-23', module:'Lab 5 · Storefront', title:'Lab 5 · Step 1 — Explore the Starter Frontend', body:`<p><strong>Step 1 Explore the starter frontend</strong> ⏱ 10 min</p>
<p>Open the frontend folder in VS Code. Find and read these files:</p>
<p class="wb-heading"><strong>Track A &amp; C — React TypeScript</strong></p>
<blockquote>
<p>frontend/src/App.tsx ← product listing page</p>
<p>frontend/src/pages/ProductDetail.tsx ← product detail page</p>
<p>frontend/src/api/client.ts ← API calls to backend</p>
</blockquote>
<p class="wb-heading"><strong>Track B — Angular</strong></p>
<blockquote>
<p>frontend/src/app/pages/product-list/product-list.component.ts</p>
<p>frontend/src/app/pages/product-detail/product-detail.component.ts</p>
<p>frontend/src/app/services/product.service.ts</p>
</blockquote>
<p>In your own words — what does the API client / product service do?
What endpoints does it call?</p>` },
{ id:'l2-24', module:'Lab 5 · Storefront', title:'Lab 5 · Step 2 — Connect the Product Listing Page', body:`<p><strong>Step 2 Connect the product listing page</strong> ⏱ 25 min</p>
<p>The listing page already has the UI structure — your job is to wire
up the data fetch. Find the useEffect (React) or ngOnInit (Angular) and
make it call GET /api/products.</p>
<p class="wb-heading"><strong>Track A &amp; C — App.tsx (React)</strong></p>
<blockquote>
<p>// useEffect runs on page load</p>
<p>useEffect(() =&gt; {</p>
<p>getProducts()</p>
<p>.then(setProducts)</p>
<p>.catch(e =&gt; setError(e.message))</p>
<p>.finally(() =&gt; setLoading(false))</p>
<p>}, [])</p>
</blockquote>
<p class="wb-heading"><strong>Track B — product-list.component.ts (Angular)</strong></p>
<blockquote>
<p>// ngOnInit runs when component initialises</p>
<p>ngOnInit() {</p>
<p>this.productService.getProducts().subscribe({</p>
<p>next: (products) =&gt; { this.products = products; this.loading =
false; },</p>
<p>error: (err) =&gt; { this.error = err.message; this.loading = false;
}</p>
<p>});</p>
<p><strong>🖥️ What you should see</strong></p>
<p>Open the Codespaces storefront URL (port 5173) — refresh the
page.</p>
<p>Six Kape Ko product cards should appear with roast badges, names,
origins, and pricing.</p>
<p>If Lab 4 is complete, the marketing hook appears below the origin on
each card.</p>
<p>The roast filter buttons (All / Light / Medium / Dark) should
work.</p>
<p><strong>🛑 If you are stuck</strong></p>
<p>"Spring Boot not running" error on the page → check Terminal 1 —
backend must be running.</p>
<p>"CORS error" in the browser console → CORS is already configured in
the starter code.</p>
<p>Check that you are accessing via the Codespaces URL (*.github.dev),
not localhost.</p>
<p>"Cannot read properties of undefined" → the API returned an
unexpected shape.</p>
<p>Open browser DevTools → Network tab → click the /api/products request
→ see the actual response.</p>
</blockquote>` },
{ id:'l2-25', module:'Lab 5 · Storefront', title:'Lab 5 · Step 3 — Add Roast Filter', body:`<p><strong>Step 3 Add roast filter</strong> ⏱ 15 min</p>
<p>The filter buttons are already rendered. Wire them up so clicking
"Light" shows only light roast products:</p>
<p class="wb-heading"><strong>Track A &amp; C — React</strong></p>
<blockquote>
<p>const filtered = filter === "All"</p>
<p>? products</p>
<p>: products.filter(p =&gt; p.roast === filter)</p>
</blockquote>
<p class="wb-heading"><strong>Track B — Angular</strong></p>
<blockquote>
<p>applyFilter() {</p>
<p>this.filteredProducts = this.filter === "All"</p>
<p>? this.products</p>
<p>: this.products.filter(p =&gt; p.roast === this.filter);</p>
</blockquote>` },
{ id:'l2-26', module:'Lab 5 · Storefront', title:'Lab 5 · Step 4 — Complete the Product Detail Page', body:`<p><strong>Step 4 Complete the product detail page</strong> ⏱ 30 min</p>
<p>When a learner clicks a product card, it should navigate to
/products/SKU-001 and show the full product details including the Lab 4
AI-generated content.</p>
<p>The detail page needs to display:</p>
<blockquote>
<p><strong>▸</strong> Product name + marketing hook (italic, amber
color)</p>
<p><strong>▸</strong> Origin grid: farm, farmer, altitude, variety,
process</p>
<p><strong>▸</strong> Flavor chips</p>
<p><strong>▸</strong> Product description (3 paragraphs from Lab 4)</p>
<p><strong>▸</strong> Feature bullets (from Lab 4)</p>
<p><strong>▸</strong> Pricing — one-time and subscription — with savings
callout</p>
<p><strong>▸</strong> Subscribe CTA button</p>
<p><strong>▸</strong> Pairing suggestion (from Lab 4)</p>
<p><strong>💡 Tip</strong></p>
<p>The Lab 4 content fields are optional — they may be undefined if
enrichment was not run.</p>
<p>Always check before rendering: {product.marketing_hook &amp;&amp;
&lt;p&gt;"{product.marketing_hook}"&lt;/p&gt;}</p>
<p>In Angular: *ngIf="product.marketing_hook"</p>
<p>This prevents blank sections when viewing a product that was not
enriched.</p>
</blockquote>
<p>After completing the detail page — open Benguet Sunrise in the
storefront. Does it show all the AI-generated content from Lab 4?</p>` },
{ id:'l2-27', module:'Lab 5 · Storefront', title:'Lab 5 · Step 5 — Self-review: Commerce Quality Check', body:`<p><strong>Step 5 Self-review — commerce quality check</strong> ⏱ 20
min</p>
<p>You have now built a working AI-powered Kape Ko storefront. Before
moving to Level 3, do a critical review:</p>
<p class="wb-heading"><strong>5a. Product listing — what is missing?</strong></p>
<p>Look at the listing page as if you are a customer arriving for the
first time. What would a real Kape Ko shopper expect to see that is not
there yet?</p>
<p class="wb-heading"><strong>5b. Product detail — commercial completeness</strong></p>
<p>Does the detail page have enough information for a customer to make a
purchase decision? What is missing that a real Hybris / SFCC product
page would have?</p>
<p class="wb-heading"><strong>5c. AI content quality — honest assessment</strong></p>
<p>Read the product descriptions and hooks. Are they good enough to
publish on a real Kape Ko site? What would need to improve before a
client would accept them?</p>
<blockquote>
<p><strong>✅ Checkpoint</strong></p>
<p>Product listing loads 6 products from GET /api/products</p>
<p>Roast filter works — clicking Light/Medium/Dark filters the grid</p>
<p>Clicking a product card navigates to the detail page</p>
<p>Product detail shows AI-generated content from Lab 4 (description,
hook, bullets)</p>
<p>Pricing shows both one-time and subscription price with savings</p>
<p>Code is committed to GitHub (git add . &amp;&amp; git commit -m
"Level 2 complete")</p>
</blockquote>` },
{ id:'l2-28', module:'Level 2 · Reflection', title:'Level 2 Reflection', body:`<p>You have built a working AI-powered Kape Ko commerce backend and
storefront. Before the Sprint 2 review, answer these reflection
questions.</p>
<p class="wb-heading"><strong>1. The architecture</strong></p>
<p>Draw or describe the flow of a request from the React/Angular
frontend to the LLM API and back. Include every component in the
chain.</p>
<p class="wb-heading"><strong>2. The AI pattern</strong></p>
<p>In your own words — what is the difference between what you built in
Level 1 (M365 Agent) and what you built in Level 2 (LLM API calls in
code)?</p>
<p class="wb-heading"><strong>3. The commerce connection</strong></p>
<p>Name one real Hybris / SFCC / AEM feature that maps directly to
something you built in Labs 3, 4, or 5. Explain the connection.</p>
<p class="wb-heading"><strong>4. What comes next</strong></p>
<p>The storefront you built in Lab 5 is the shell for Level 3. What AI
features do you think Labs 6, 7, and 8 will add to this storefront?</p>
<p><em>SONG Commerce AI Labs · Season 1 · Level 2: Commerce Builder ·
Learner Workbook · v1.1</em></p>
<p><em>All tracks — self-paced · GitHub Codespaces · Azure
OpenAI</em></p>` },
{ id:'l34-01', module:'Levels 3–4 · Orientation', title:'Levels 3–4 — Why These Labs Still Matter', body:`<p>Season 1 · Levels 3 &amp; 4</p>
<p class="wb-heading"><strong>Learner Workbook</strong></p>
<p>Labs 6–10 · Self-paced · Adds AI features to your Level 2
storefront</p>
<p>Level 3: <strong>Lab 6 Shopping Copilot · Lab 7 Commerce RAG · Lab 8
Recommendations</strong></p>
<p>Level 4: <strong>Lab 9 Order Agent · Lab 10 Multi-Agent
Pipeline</strong></p>
<p class="wb-heading"><strong>WHY THESE LABS STILL MATTER</strong></p>
<p class="wb-heading"><strong>Learn to understand, design, validate, and operate AI-enabled
commerce systems, even when AI writes much of the code.</strong></p>
<p>Modern commerce teams may use Copilot, Lovable, Retool, Power
Platform, and other low-code or no-code tools to accelerate delivery.
These tools can generate code, interfaces, workflows, recommendations,
and agent behaviors, but they do not remove the need for commerce,
architecture, and engineering judgment.</p>
<p class="wb-heading"><strong>Learners must still understand:</strong></p>
<blockquote>
<p>• What system they should ask AI to build</p>
<p>• How to determine whether the output is correct</p>
<p>• Where the solution can fail</p>
</blockquote>
<p class="wb-heading"><strong>These labs are not intended to make learners compete with AI
at writing code. They build the judgment needed to direct AI, challenge
its output, connect business requirements to technology decisions, and
operate solutions responsibly.</strong></p>
<p class="wb-heading"><strong>Every lab therefore defines two explicit
outcomes:</strong></p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> What part of the ecommerce
workflow becomes more effective, reliable, or valuable?</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> What decision must the learner
understand and defend, even when AI generates much of the
implementation?</td>
</tr>
</tbody>
</table>
<p>The activity explains what to build. The two outcomes explain why the
work remains important in an AI-assisted, low-code, and no-code delivery
model. As the labs progress from conversational AI to agentic systems,
the learner is expected to apply stronger validation, control, and
operational judgment.</p>` },
{ id:'l34-02', module:'Levels 3–4 · Orientation', title:'Levels 3–4 Overview', body:`<p>This level focuses on building the following solutions:</p>
<table>
<colgroup>
<col style="width: 10%"/>
<col style="width: 19%"/>
<col style="width: 21%"/>
<col style="width: 24%"/>
<col style="width: 24%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Lab</strong></th>
<th><strong>Topic</strong></th>
<th><strong>Systems-Thinking Lesson</strong></th>
<th><strong>Rationale</strong></th>
<th><strong>Business Value</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Lab 6</td>
<td>Shopping Copilot</td>
<td>Conversational commerce and session context</td>
<td>Helps customers discover products through natural conversation.</td>
<td>Increases engagement, product discovery, and potential
conversion.</td>

{ id:'l34-04', module:'Lab 6 · Shopping Copilot', title:'Lab 6 Overview — Shopping Copilot', body:`<p>⏱ 90 min Backend + React component · AI skill: conversational
commerce</p>
<p>Prerequisite: Level 2 storefront running on Codespaces</p>
<p class="wb-heading"><strong>WHY THIS LAB STILL MATTERS</strong></p>
<p>AI can generate conversational responses quickly, but a commerce
copilot must do more than sound helpful. It must interpret customer
intent, use approved product information, recommend an appropriate item,
preserve context, and stay within clear commercial boundaries. This lab
develops the judgment to design and evaluate a conversation that
supports a real shopping decision.</p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> Improve product discovery and
guided selling by helping customers translate needs, moods, and
occasions into relevant product choices.</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> Decide what product context
belongs in the prompt, how conversation state should be maintained, what
response constraints are required, and how recommendation quality should
be tested.</td>
</tr>
</tbody>
</table>
<p>The goal is not simply to make the feature run. The goal is to
understand and defend the decisions that make the AI capability
relevant, grounded, controlled, and safe to operate.</p>
<p>In Lab 6 you build a chat widget embedded in the Kape Ko storefront.
A customer types "I need coffee for a stressed Monday" and the Copilot
recommends Mt. Apo Dark with a reason. This is Stage 3 of the Lab 2
journey map — now built.</p>
<blockquote>
<p><strong>🤖 AI concept</strong></p>
<p>AI skill: conversational commerce.</p>
<p>The Shopping Copilot is not just a chatbot — it is a product
recommendation engine</p>
<p>wrapped in a conversational interface. The system prompt contains the
full Kape Ko catalog.</p>
<p>The LLM maps customer intent (mood, occasion, taste preference) to a
specific product.</p>
<p>Conversation history is maintained per session — the copilot
remembers context.</p>
<p>This is the same pattern used by SFCC Einstein Copilot and SAP
Joule.</p>
</blockquote>` },

{ id:'l34-06', module:'Lab 6 · Shopping Copilot', title:'Lab 6 · Step 2 — Add the Chat Endpoints', body:`<p><strong>Step 2 Add the chat endpoints to KapeKoController</strong> ⏱

{ id:'l34-07', module:'Lab 6 · Shopping Copilot', title:'Lab 6 · Step 3 — Test the Chat Endpoint', body:`<p><strong>Step 3 Test the chat endpoint</strong> ⏱ 15 min</p>

<p>are not being followed. Check SYSTEM_PROMPT_TEMPLATE — the "exactly

</blockquote>` },

{ id:'l34-10', module:'Lab 7 · Commerce RAG', title:'Lab 7 Overview — Commerce RAG', body:`<p>⏱ 120 min Backend + React component · AI skill: Retrieval-Augmented
Generation</p>
<p>Prerequisite: Level 2 storefront running on Codespaces</p>
<p class="wb-heading"><strong>WHY THIS LAB STILL MATTERS</strong></p>
<p>AI can produce convincing answers without reliable evidence.
Retrieval-Augmented Generation reduces that risk by retrieving approved
commerce data before generating a response. The important skill is not
merely connecting an embedding model. It is deciding what to index, how
to retrieve relevant results, how to ground the answer, and how to show
where the answer came from.</p>
<table>
<colgroup>
<col style="width: 100%"/>
</colgroup>
<thead>
<tr class="header">
<th><strong>Business outcome:</strong> Make commerce search and product
answers more relevant, trustworthy, and traceable by grounding them in
approved catalog information.</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Technical judgment:</strong> Decide how source content is
represented, indexed, retrieved, ranked, and passed to the model, and
how to validate that generated answers use the retrieved evidence rather
than invented information.</td>
</tr>
</tbody>
</table>
<p>The goal is not simply to make the feature run. The goal is to
understand and defend the decisions that make the AI capability
relevant, grounded, controlled, and safe to operate.</p>
<p>In Lab 7 you build real semantic search on the Kape Ko catalog.
"Light floral coffee" returns Benguet Sunrise — not because of keyword
matching, but because the vector representations are similar. This
completes the RAG pattern you first experienced in Lab 1.</p>
<blockquote>
<p><strong>🤖 AI concept</strong></p>
<p>AI skill: Retrieval-Augmented Generation (RAG) — the full
pipeline.</p>
<p>EMBED: At server startup, every product description is converted to a
float[] vector</p>
<p>by calling the embedding API. This is the mathematical representation
of meaning.</p>
<p>RETRIEVE: When a customer searches, their query is also embedded.
Cosine similarity</p>
<p>finds the products whose vectors are closest to the query vector.</p>
<p>GENERATE: The retrieved products become context. The LLM generates an
answer using</p>
<p>ONLY that context — no hallucination, every answer traceable to a
source.</p>
<p>This is the technical architecture behind the Lab 1 Run 1 vs Run 2
difference.</p>
<p>Now you are building it yourself.</p>
</blockquote>` },
{ id:'l34-11', module:'Lab 7 · Commerce RAG', title:'Lab 7 · Step 1 — Add RagService.java', body:`<p><strong>Step 1 Add RagService.java to your backend</strong> ⏱ 15
min</p>
<p>Copy RagService.java from the Level 3 zip into:</p>
<blockquote>
<p>backend/src/main/java/com/song/kapeko/service/RagService.java</p>
</blockquote>
<p>Read the three key methods carefully:</p>
<blockquote>
<p><strong>▸</strong> indexCatalog() — annotated with @PostConstruct,
runs at startup</p>
<p><strong>▸</strong> retrieve(query, topK) — cosine similarity
search</p>
<p><strong>▸</strong> search(query) — full RAG pipeline (retrieve +
generate)</p>
</blockquote>
<p>Also add the embed() method and completeWithHistory() from
LlmServiceAdditions.java to your existing LlmService.java.</p>
<p class="wb-heading"><strong>In your own words — what does @PostConstruct mean and why is indexCatalog() annotated with it?</strong></p>` },
{ id:'l34-12', module:'Lab 7 · Commerce RAG', title:'Lab 7 · Step 2 — Understand Cosine Similarity', body:`<p><strong>Step 2 Understand cosine similarity</strong> ⏱ 15 min</p>
<p>Find the cosineSimilarity() method in RagService.java. Read it
carefully.</p>
<p class="wb-heading"><strong>2a. What does a cosine similarity of 1.0 mean? What does 0.0 mean?</strong></p>
<p class="wb-heading"><strong>2b. Why is cosine similarity better than exact string matching for product search?</strong></p>
<blockquote>
<p><strong>💡 Tip</strong></p>
<p>"light floral coffee" has zero words in common with "Benguet Sunrise
— Light Roast".</p>
<p>But their vector representations are close — both contain concepts of
lightness,</p>
<p>floral notes, and morning coffee. Cosine similarity catches this.
String matching does not.</p>
</blockquote>` },
{ id:'l34-13', module:'Lab 7 · Commerce RAG', title:'Lab 7 · Step 3 — Add RAG Endpoints', body:`<p><strong>Step 3 Add RAG endpoints to the controller</strong> ⏱ 10
min</p>
<p>Add from KapeKoControllerAdditions.java:</p>
<blockquote>
<p>GET /api/search?q=... → ragService.search(q)</p>
<p>POST /api/rag/index → ragService.reindex()</p>
</blockquote>
<p>Inject RagService into the constructor.</p>` },
{ id:'l34-14', module:'Lab 7 · Commerce RAG', title:'Lab 7 · Step 4 — Test Semantic Search', body:`<p><strong>Step 4 Test semantic search</strong> ⏱ 20 min</p>
<p>Restart the server. Watch the terminal on startup — you should see
indexing logs. Then test:</p>
<blockquote>
<p>GET http://localhost:8080/api/search?q=light+floral+coffee</p>
<p><strong>🖥️ What you should see</strong></p>
<p>Terminal on startup: "🔍 RagService: indexing 6 products..."</p>
<p>"✅ RagService: indexed 6 products"</p>
<p>Search response: {</p>
<p>"query": "light floral coffee",</p>
<p>"answer": "For a light floral coffee, Benguet Sunrise would be
perfect...",</p>
<p>"sources": ["SKU-001"],</p>
<p>"products": [{ Benguet Sunrise data }]</p>
<p>}</p>
<p><strong>🛑 If you are stuck</strong></p>
<p>"Vector store is empty" → catalog.json may not exist. Run POST
/api/catalog/generate.</p>
<p>Or the indexing failed silently — check the startup logs for error
messages.</p>
<p>"401" from embedding API → embedding models need separate deployment
in Azure.</p>
<p>In Azure Portal → Azure OpenAI → Deployments → Deploy
text-embedding-ada-002.</p>
<p>Then update AZURE_OPENAI_ENDPOINT to point to the embedding
deployment for embed() calls.</p>
</blockquote>
<p class="wb-heading"><strong>Run these 3 queries. Record the top result and whether it makes semantic sense:</strong></p>

<td></td>
<td></td>
</tr>
<tr class="odd">

<td></td>
<td></td>
</tr>
</tbody>
</table>` },
